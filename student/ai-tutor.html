<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AI 튜터</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

  <!-- MediaPipe FaceMesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ── 카메라 배경 ── */
    #cam-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0;
    }
    .cam-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.38);
      z-index: 1;
    }

    /* ── 상단바 ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.72), transparent);
    }
    #back-btn {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 0.32rem 0.75rem;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }
    #page-title { font-size: 0.88rem; font-weight: bold; flex: 1; }
    .top-badge {
      font-size: 0.66rem;
      padding: 0.18rem 0.5rem;
      border-radius: 2rem;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }
    #unit-label { background: rgba(79,142,247,0.35); color: #acd; }
    #conc-badge { background: rgba(39,174,96,0.32); color: #8ef; display: none; }
    .top-icon-btn {
      width: 32px; height: 32px;
      border: none; border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: #fff; font-size: 0.95rem;
      cursor: pointer; flex-shrink: 0;
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
    }

    /* ── 집체교육 배너 ── */
    #class-banner {
      position: fixed;
      top: 3.2rem; left: 0; right: 0;
      z-index: 19;
      background: rgba(220,50,47,0.88);
      color: #fff;
      text-align: center;
      padding: 0.38rem;
      font-size: 0.8rem;
      font-weight: bold;
      backdrop-filter: blur(6px);
      display: none;
    }

    /* ── 채팅창 (좌측 하단) ── */
    #chat-window {
      position: fixed;
      bottom: 0.8rem;
      left: 0.65rem;
      width: 61%;
      max-height: 44vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
    }

    /* 빠른 질문 버튼 */
    #quick-btns {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 0.05rem;
    }
    #quick-btns::-webkit-scrollbar { display: none; }
    .qq-btn {
      white-space: nowrap;
      padding: 0.28rem 0.65rem;
      background: rgba(79,142,247,0.28);
      color: #cde;
      border: 1px solid rgba(79,142,247,0.45);
      border-radius: 2rem;
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
      backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
    }
    .qq-btn:active { background: rgba(79,142,247,0.5); }

    /* 메시지 목록 */
    #chat-messages {
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(12px);
      border-radius: 1rem;
      padding: 0.6rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      overflow-y: auto;
      max-height: 28vh;
      min-height: 56px;
    }
    .msg { display: flex; flex-direction: column; max-width: 88%; }
    .msg.tutor { align-self: flex-start; }
    .msg.user  { align-self: flex-end; }
    .msg .sender { font-size: 0.6rem; color: rgba(255,255,255,0.45); margin-bottom: 0.12rem; }
    .msg.user .sender { text-align: right; }
    .msg .bubble {
      padding: 0.42rem 0.62rem;
      border-radius: 0.72rem;
      font-size: 0.78rem;
      line-height: 1.44;
    }
    .msg.tutor .bubble {
      background: rgba(79,142,247,0.32);
      border-bottom-left-radius: 0.15rem;
      color: #e8f4ff;
    }
    .msg.user .bubble {
      background: rgba(255,255,255,0.18);
      border-bottom-right-radius: 0.15rem;
      color: #fff;
    }
    .typing-dots {
      display: flex; gap: 4px; padding: 0.42rem 0.62rem;
      background: rgba(79,142,247,0.25); border-radius: 0.72rem; width: fit-content;
    }
    .typing-dots span {
      width: 6px; height: 6px; background: #7ab; border-radius: 50%;
      animation: tdot 1s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot { 0%,80%,100%{opacity:0.25} 40%{opacity:1} }

    /* 입력창 */
    #chat-input-row {
      display: flex;
      gap: 0.38rem;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      padding: 0.48rem 0.72rem;
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 1.5rem;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      resize: none;
      max-height: 60px;
      line-height: 1.4;
    }
    #chat-input::placeholder { color: rgba(255,255,255,0.35); }
    #chat-input:focus { border-color: rgba(79,142,247,0.6); }
    #send-btn {
      width: 34px; height: 34px; flex-shrink: 0;
      background: #4f8ef7; border: none; border-radius: 50%;
      color: #fff; font-size: 0.88rem; cursor: pointer;
    }

    /* ── AI 캐릭터 (드래그 가능) ── */
    #char-container {
      position: fixed;
      z-index: 15;
      top: 0;
      right: 0;
      width: 44%;
      height: 52vh;       /* 컨테이너 높이로 하반신 잘라냄 */
      overflow: hidden;   /* 넘치는 하단 이미지 숨김 */
      cursor: grab;
      touch-action: none;
      user-select: none;
      animation: slideDown 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      background: transparent !important;
      background-color: transparent !important;
    }
    #char-container:active { cursor: grabbing; }
    @keyframes slideDown {
      from { transform: translateY(-60px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    /* 캐릭터 이미지 — 전신 렌더 후 컨테이너가 상반신만 노출 */
    #char-img {
      width: 100%;
      height: 84vh;          /* 전신 기준 높이 유지 */
      object-fit: contain;
      object-position: top center;
      user-select: none;
      -webkit-user-drag: none;
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }
    #char-fallback {
      font-size: 11vh;
      text-align: center;
      padding-top: 0.5rem;
      display: none;
      background: transparent !important;
    }

    /* ── 마이크 ON 상태 표시 ── */
    #mic-mode-btn.mic-on {
      background: rgba(220,50,47,0.78) !important;
      box-shadow: 0 0 8px rgba(220,50,47,0.55);
    }

    /* ── 음성 인식 중 실시간 표시 ── */
    #interim-bubble {
      display: none;
      align-self: flex-end;
      max-width: 88%;
      padding: 0.38rem 0.62rem;
      background: rgba(255,255,255,0.08);
      border: 1px dashed rgba(255,255,255,0.28);
      border-radius: 0.72rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.55);
      font-style: italic;
      line-height: 1.4;
    }

  </style>
</head>
<body>

<video id="cam-video" autoplay muted playsinline></video>
<div class="cam-overlay"></div>

<!-- 상단바 -->
<div id="top-bar">
  <button id="back-btn" onclick="goHome()">← 홈</button>
  <div id="page-title">🤖 AI 튜터</div>
  <span class="top-badge" id="unit-label">1단원</span>
  <span class="top-badge" id="conc-badge">집중 100%</span>
  <button class="top-icon-btn" id="mic-mode-btn" onclick="toggleMic()" title="마이크 OFF — 클릭하여 켜기">🎤</button>
  <button class="top-icon-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
  <button onclick="SessionManager.logout()" style="
    background:rgba(255,255,255,0.10);color:#888;
    border:1px solid rgba(255,255,255,0.14);border-radius:2rem;
    padding:0.28rem 0.65rem;font-size:0.7rem;cursor:pointer;
    flex-shrink:0;backdrop-filter:blur(6px);white-space:nowrap;">로그아웃</button>
</div>

<!-- 집체교육 배너 (hidden; overlay로 대체) -->
<div id="class-banner" style="display:none">🏫 집체교육 중 — 음성 자동 음소거</div>

<!-- 수업중 AI튜터 비활성화 오버레이 -->
<div id="class-overlay" style="
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.84); z-index:50;
  flex-direction:column; align-items:center; justify-content:center;
  backdrop-filter:blur(8px); text-align:center; padding:2rem;
">
  <div style="font-size:3.5rem;margin-bottom:1rem">🏫</div>
  <div style="font-size:1.1rem;font-weight:bold;margin-bottom:0.6rem">수업 진행 중입니다</div>
  <div style="font-size:0.85rem;color:#aaa;line-height:1.65;max-width:280px">
    AI 튜터은 수업 종료 후 이용 가능합니다.
  </div>
</div>

<!-- 채팅창 (좌측 하단) -->
<div id="chat-window">
  <div id="quick-btns">
    <button class="qq-btn" onclick="askQuick('신호수란 무엇인가요?')">신호수란?</button>
    <button class="qq-btn" onclick="askQuick('정지신호 방법을 알려주세요')">정지신호 방법</button>
    <button class="qq-btn" onclick="askQuick('진행신호 방법을 알려주세요')">진행신호 방법</button>
    <button class="qq-btn" onclick="askQuick('오늘 배운 내용을 복습해주세요')">오늘 복습하기</button>
  </div>
  <div id="chat-messages"></div>
  <div id="interim-bubble"></div>
  <div id="chat-input-row">
    <textarea id="chat-input" placeholder="질문 입력..." rows="1"></textarea>
    <button id="send-btn" onclick="sendText()">➤</button>
  </div>
</div>

<!-- AI 캐릭터 (우측 상단) -->
<div id="char-container" style="background:transparent!important;background-color:transparent!important;mix-blend-mode:normal;-webkit-background-clip:unset;">
  <img id="char-img"
    src="../assets/instructor_idle.png?v=2"
    alt="AI 튜터"
    style="background:transparent!important;background-color:transparent!important;mix-blend-mode:normal;-webkit-background-clip:unset;"
    onerror="this.style.display='none';document.getElementById('char-fallback').style.display='block'">
  <div id="char-fallback">🪖</div>
</div>

<!-- 의존 스크립트 -->
<script src="../js/config.js"></script>
<script src="../js/session-manager.js"></script>
<script src="../js/firebase-manager.js"></script>
<script src="../js/data-manager.js"></script>

<script>
// ══════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════
const GEMINI_API_KEY = 'AIzaSyCgjgu3vXiGmcY8VvxaRbC6HBmr9IM9vwo';

let session          = null;
let isClassMode      = false;
let isMuted          = false;
let micOn            = false;
let isSpeaking       = false;
let talkInterval     = null;
let currentVoice     = null;
let frownStart       = null;
let idleTimer        = null;
let sessionStart     = Date.now();
let curriculum       = null;
let messages         = [];
let cameraStream     = null;
let concScore        = 80;
let concSmoothed     = 80;
let wasClassMode     = false;

// STT 상태
let recognition      = null;
let isRecognizing    = false;
let interimText      = '';
let silenceTimer     = null;
const SILENCE_MS     = 3000;

// ── 자동 개입 상태 ──
let isInterventionActive  = false;
let lastFrownIntervention = 0;
let lastIdleIntervention  = 0;
const PAGE_LOAD_TIME = Date.now();
const IDLE_DELAY     = 60000;   // 60s 무입력 후 개입
const IDLE_COOLDOWN  = 300000;  // 개입 후 5분 대기
const FROWN_DURATION = 5000;    // 5s 연속 찌푸림
const FROWN_COOLDOWN = 600000;  // 개입 후 10분 대기
const GRACE_PERIOD   = 30000;   // 페이지 로드 후 30s 유예

const charImg = document.getElementById('char-img');

// ══════════════════════════════════════════════
//  Boot
// ══════════════════════════════════════════════
SessionManager.requireSession(async s => {
  session = s;

  document.getElementById('unit-label').textContent = `${s.currentUnit || 1}단원`;

  initVoices();
  initSpeechRecognition();
  await startCamera();

  await FirebaseManager.init();

  // 수업 모드 실시간 감지
  FirebaseManager.watchClassMode(active => {
    if (active) disableAITutor();
    else        enableAITutor();
  });

  // heartbeat 감시 — 교사앱이 5분간 heartbeat 없으면 자동 활성화
  FirebaseManager.watchHeartbeat(lastBeat => {
    if (lastBeat && Date.now() - lastBeat > 300000 && isClassMode) {
      enableAITutor();
    }
  });

  loadCurriculum();
  updateMicBtn();

  // 인사
  const days = SessionManager.getDaysSinceLastAccess();
  setTimeout(() => {
    if (days >= 3) {
      greet(`오랜만이에요! ${days}일 만에 오셨군요. ` +
            `저번에 ${s.currentUnit || 1}단원까지 하셨는데, 핵심만 30초 복습하고 시작할까요?`);
    } else {
      greet(`안녕하세요, ${s.name}님! 무엇이든 궁금한 것을 물어보세요 😊`);
    }
  }, 700);

  resetIdleTimer();
  initCharDrag();

  window.addEventListener('beforeunload', () => {
    DataManager.addStudyTime(Math.round((Date.now() - sessionStart) / 1000));
  });
});

// ══════════════════════════════════════════════
//  TTS
// ══════════════════════════════════════════════
function initVoices() {
  const load = () => {
    const voices = window.speechSynthesis.getVoices();
    currentVoice =
      voices.find(v => v.lang === 'ko-KR' && /female|woman|여성|미/i.test(v.name)) ||
      voices.find(v => v.lang === 'ko-KR') ||
      voices.find(v => v.lang.startsWith('ko')) ||
      null;
  };
  load();
  window.speechSynthesis.onvoiceschanged = load;
}

function speak(text) {
  if (!window.speechSynthesis || isMuted || isClassMode) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(stripEmoji(text));
  utt.lang  = 'ko-KR';
  utt.rate  = 0.92;
  utt.pitch = 1.05;
  if (currentVoice) utt.voice = currentVoice;
  utt.onstart = () => {
    isSpeaking = true; startTalkAnim();
    clearSilenceTimer();
    clearInterim();
    // abort()로 즉시 강제 중단 (stop()은 버퍼 처리 후 종료라 TTS 음성이 인식될 수 있음)
    if (isRecognizing) {
      isRecognizing = false;
      try { recognition.abort(); } catch {}
    }
  };
  utt.onend = utt.onerror = () => {
    isSpeaking = false; stopTalkAnim();
    if (micOn) setTimeout(startRecognition, 500);
  };
  window.speechSynthesis.speak(utt);
}

function stripEmoji(text) {
  return text
    .replace(/[\u{1F300}-\u{1FFFF}]/gu, '')
    .replace(/[\u{2600}-\u{26FF}]/gu, '')
    .replace(/[\u{2700}-\u{27BF}]/gu, '')
    .replace(/[😀-🙏]/gu, '')
    .trim();
}

function stopSpeak() {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  stopTalkAnim();
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
  if (isMuted) stopSpeak();
}

// ══════════════════════════════════════════════
//  캐릭터 애니메이션
// ══════════════════════════════════════════════
const IMG_TS = Date.now();
const CHAR = {
  idle: `../assets/instructor_idle.png?v=${IMG_TS}`,
  talk: `../assets/instructor_talk.png?v=${IMG_TS}`,
  wave: `../assets/instructor_wave.png?v=${IMG_TS}`,
};

// 미리 로드
Object.values(CHAR).forEach(src => { const p = new Image(); p.src = src; });
// 초기 이미지 반영
charImg.src = CHAR.idle;

function setChar(state) {
  charImg.src = CHAR[state] || CHAR.idle;
}

function startTalkAnim() {
  if (talkInterval) return;
  let t = false;
  talkInterval = setInterval(() => { setChar(t ? 'talk' : 'idle'); t = !t; }, 300);
}

function stopTalkAnim() {
  clearInterval(talkInterval);
  talkInterval = null;
  setChar('idle');
}

function waveAnim(cb) {
  stopTalkAnim();
  setChar('wave');
  setTimeout(() => { setChar('idle'); if (cb) cb(); }, 2000);
}

function greet(text) {
  waveAnim();
  addMessage('tutor', text);
  speak(text);
}

// ══════════════════════════════════════════════
//  STT — Web Speech API (연속 인식 + 3초 침묵 자동 전송)
// ══════════════════════════════════════════════

// 한국어 STT가 영어 단어를 음소 변환한 것을 원래 영어로 복원
const STT_CORRECTIONS = [
  [/재미나이|재미나|제미나이|제미나/gi, 'Gemini'],
  [/플래시/gi,                          'Flash'],
  [/에이피아이|에이 피 아이/gi,          'API'],
  [/에이아이/gi,                         'AI'],
  [/챗지피티|챗 지피티/gi,               'ChatGPT'],
  [/유알엘|유 알 엘/gi,                  'URL'],
];

function normalizeSTT(text) {
  let out = text;
  for (const [pattern, replacement] of STT_CORRECTIONS) {
    out = out.replace(pattern, replacement);
  }
  return out;
}

function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  recognition = new SR();
  recognition.lang           = 'ko-KR';
  recognition.continuous     = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    // TTS 재생 중이면 결과 전부 무시 (피드백 루프 방지)
    if (isSpeaking) return;

    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        interimText += normalizeSTT(e.results[i][0].transcript);
        resetSilenceTimer();
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    showInterim(interimText + normalizeSTT(interim));
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    isRecognizing = false;
    if (micOn && !isSpeaking) setTimeout(startRecognition, 800);
  };

  recognition.onend = () => {
    isRecognizing = false;
    if (micOn && !isSpeaking) setTimeout(startRecognition, 300);
  };
}

function startRecognition() {
  if (!recognition || isRecognizing || isSpeaking) return;
  try { recognition.start(); isRecognizing = true; } catch {}
}

function stopRecognition() {
  clearSilenceTimer();
  clearInterim();
  isRecognizing = false;
  if (!recognition) return;
  try { recognition.stop(); } catch {}
  try { recognition.abort(); } catch {}
}

function resetSilenceTimer() {
  clearSilenceTimer();
  silenceTimer = setTimeout(() => {
    if (interimText.trim()) submitVoiceInput();
  }, SILENCE_MS);
}

function clearSilenceTimer() {
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
}

function submitVoiceInput() {
  clearSilenceTimer();
  const text = interimText.trim();
  interimText = '';
  clearInterim();
  if (text) handleUserInput(text);
}

function showInterim(text) {
  const el = document.getElementById('interim-bubble');
  if (!el) return;
  el.style.display = text.trim() ? 'block' : 'none';
  el.textContent   = text;
}

function clearInterim() {
  interimText = '';
  showInterim('');
}

function toggleMic() {
  micOn = !micOn;
  if (micOn) {
    interimText = '';
    startRecognition();
  } else {
    // 마이크 끄면 쌓인 텍스트 즉시 전송
    if (interimText.trim()) submitVoiceInput();
    else stopRecognition();
  }
  updateMicBtn();
}

function updateMicBtn() {
  const btn = document.getElementById('mic-mode-btn');
  if (micOn) {
    btn.textContent = '🎤';
    btn.classList.add('mic-on');
    btn.title = '마이크 ON — 클릭하여 끄기';
  } else {
    btn.textContent = '🎤';
    btn.classList.remove('mic-on');
    btn.title = '마이크 OFF — 클릭하여 켜기';
  }
}

const MAX_MSGS = 5;

function addMessage(type, text, isTyping = false) {
  if (!isTyping) {
    messages.push({ type, text });
    if (messages.length > MAX_MSGS) messages.shift();
  }
  renderMessages(isTyping);
}

function renderMessages(showTyping = false) {
  const el = document.getElementById('chat-messages');
  const html = messages.map(m => `
    <div class="msg ${m.type}">
      <div class="sender">${m.type === 'tutor' ? '🤖 교관' : '👤 나'}</div>
      <div class="bubble">${esc(m.text)}</div>
    </div>`).join('');
  const typing = showTyping
    ? `<div class="msg tutor"><div class="sender">🤖 교관</div>
       <div class="typing-dots"><span></span><span></span><span></span></div></div>`
    : '';
  el.innerHTML = html + typing;
  el.scrollTop = el.scrollHeight;
}

function sendText() {
  const inp = document.getElementById('chat-input');
  const t   = inp.value.trim();
  if (!t) return;
  inp.value = '';
  inp.style.height = 'auto';
  handleUserInput(t);
}

function askQuick(text) { handleUserInput(text); }

async function handleUserInput(text) {
  onUserActivity();
  addMessage('user', text);

  renderMessages(true);
  const answer = await getAiResponse(text);
  addMessage('tutor', answer);
  speak(answer);
  if (session) DataManager.saveProgress({ lastAiQuery: text, lastAiResponse: answer.slice(0, 120) });
}

async function callGemini(query) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: {
          parts: [{ text: `당신은 친절한 AI 튜터입니다. 다음 규칙을 반드시 지키세요.

[공통 규칙]
- 항상 자연스러운 대화체로 답변한다
- "어떤 부분이 궁금하신가요?", "교재를 참고하세요" 같은 안내 문구·메타 발언은 절대 하지 않는다
- 대화 흐름을 끊는 어색한 표현 금지
- 답변을 거부하거나 회피하지 않는다
- 모든 답변은 한국어로 한다
- 어떤 주제로 질문해도 자유롭게 친절하게 답변한다

[PDF 교재가 제공된 경우]
- 교재 내용을 우선 참고해서 답변한다
- 교재에 없는 내용은 "교재에는 나와 있지 않지만, 제가 알고 있는 내용으로 말씀드리면..." 하고 자연스럽게 이어서 답변한다
- 절대 "교재를 참고하세요"로 끝내지 않는다` }]
        },
        contents: [{ role: 'user', parts: [{ text: query }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 512 }
      })
    }
  );

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Gemini API 오류');
  }

  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
}

async function getAiResponse(query) {
  // 1. Gemini 2.0 Flash
  try {
    const geminiRes = await callGemini(query);
    if (geminiRes) return geminiRes;
  } catch (e) {
    if (e.message?.includes('API_KEY_INVALID') || e.message?.includes('400')) {
      return 'Gemini API 키가 올바르지 않습니다. 오른쪽 위 ⚙️ 설정에서 키를 확인해주세요.';
    }
    console.warn('[Gemini]', e.message);
  }

  // 2. 키워드 매칭 fallback
  return await curriculumAnswer(query);
}

async function curriculumAnswer(query) {
  await loadCurriculum();
  const lower = query.toLowerCase();

  const MAP = [
    { k:['신호수란','신호수가 뭐','신호수 뭐','역할이','하는 일','무엇'],
      a:'신호수는 건설현장에서 크레인·지게차 같은 중장비 운전자와 현장 작업자 사이에서 안전한 신호를 전달하는 역할을 합니다. 운전자의 사각지대를 감시하고 위험을 미리 차단하는 핵심 인원이에요!' },
    { k:['정지','멈춰','보권','빨간'],
      a:'정지 신호는 빨간 보권(깃발)을 머리 위로 올려 좌우로 크게 흔듭니다. 긴급 정지는 양팔을 X자로 교차하면 됩니다. 빨간색 = 위험·정지예요!' },
    { k:['진행','가도','주권','노란'],
      a:'진행 신호는 노란 주권을 앞으로 뻗어 전방을 지시합니다. 진행 허가 전에 반드시 전방 안전을 확인하세요. 노란색 = 진행·서행!' },
    { k:['위로','올리기','상승','올려'],
      a:'위로 올리기 신호는 팔을 아래에서 위로 크게 올리는 동작입니다. 장비 상승·전진을 지시할 때 사용하며, 팔꿈치를 완전히 펴서 크게 해주세요!' },
    { k:['아래로','내리기','하강','내려'],
      a:'아래로 내리기 신호는 팔을 위에서 아래로 내리는 동작입니다. 장비 하강·정지를 지시할 때 사용합니다.' },
    { k:['수평','좌우','이동 방향'],
      a:'수평 이동 신호는 팔을 수평으로 펼쳐 이동 방향을 지시합니다. 이동 방향의 팔을 뻗고, 정지할 때는 주먹을 쥐어 신호하세요!' },
    { k:['천천히','서행','느리게','조금씩'],
      a:'서행 신호는 팔을 천천히 위아래로 움직이거나 손바닥을 아래로 밀어내는 동작입니다. 위험 구역 진입 전에 반드시 사용하세요!' },
    { k:['복장','조끼','안전모','옷'],
      a:'신호수는 형광 조끼와 안전모를 반드시 착용해야 합니다. 빨강·주황 형광 조끼를 권장하며, 다른 작업자와 명확히 구분되어야 합니다.' },
    { k:['위치','어디','서야','장소'],
      a:'신호수는 운전자가 항상 볼 수 있는 위치에 있어야 합니다. 장비 이동 경로와 선회 반경 밖의 안전한 위치를 선택하세요!' },
    { k:['긴급','비상','사고'],
      a:'긴급 정지 신호는 보권을 머리 위에서 크게 흔들거나 양팔 X자 교차입니다. 누구나 발신할 수 있으며, 장비가 완전히 멈출 때까지 신호를 유지하세요!' },
    { k:['복습','정리','요약','오늘'],
      a:`핵심 정리 드릴게요! ① 신호수 = 운전자↔작업자 안전 신호 전달 ② 보권(빨강) = 정지·위험 ③ 주권(노랑) = 진행·서행 ④ 신호수는 항상 장비 이동 경로 밖에 위치해야 합니다. 더 궁금한 부분이 있으면 물어보세요!` },
    { k:['자격','시험','교육'],
      a:'신호수 자격은 건설기계 안전운전 신호수 교육을 이수해야 합니다. 이 앱으로 꾸준히 연습하면 실습 시험에서 좋은 결과를 얻을 수 있어요!' },
  ];

  for (const item of MAP) {
    if (item.k.some(k => lower.includes(k))) return item.a;
  }

  // curriculum.json 검색
  if (curriculum?.units) {
    let best = null, bestScore = 0;
    for (const unit of curriculum.units) {
      let score = 0;
      const words = lower.split(/\s+/).filter(w => w.length >= 2);
      if (words.some(w => (unit.title || '').includes(w))) score += 4;
      for (const c of (unit.content || [])) {
        for (const w of words) {
          if ((c.text || '').includes(w)) score += 1;
          for (const kp of (c.keyPoints || [])) if (kp.includes(w)) score += 2;
        }
      }
      if (score > bestScore) { bestScore = score; best = unit; }
    }
    if (best && bestScore >= 2) {
      const c = best.content[0];
      const kps = (c.keyPoints || []).slice(0, 2).join(' · ');
      return `${best.title}에 대한 내용이에요! ${c.text || ''} ${kps ? '핵심: ' + kps : ''}`;
    }
  }

  return `"${query}"에 대해서는 해당 단원 교재를 다시 확인해보세요. 더 구체적으로 어떤 부분이 궁금하신가요?`;
}

// ══════════════════════════════════════════════
//  카메라 & FaceMesh
// ══════════════════════════════════════════════
async function startCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    const v = document.getElementById('cam-video');
    v.srcObject = cameraStream;
    await v.play().catch(() => {});
    initFaceMesh(v);
  } catch (e) {
    console.warn('[Camera]', e.message);
  }
}

function initFaceMesh(videoEl) {
  if (typeof FaceMesh === 'undefined') return;

  const fm = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });
  fm.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  fm.onResults(onFaceResults);

  // requestAnimationFrame으로 기존 스트림 재사용 (Camera 유틸 대신)
  let lastMs = 0;
  function loop() {
    requestAnimationFrame(loop);
    if (!videoEl.readyState || videoEl.paused || !videoEl.videoWidth) return;
    const now = performance.now();
    if (now - lastMs < 500) return; // ~2 fps
    lastMs = now;
    fm.send({ image: videoEl }).catch(() => {});
  }
  loop();
}

function onFaceResults(res) {
  if (!res.multiFaceLandmarks?.length) {
    // 얼굴 미감지 = 교재를 보는 중으로 간주 → 집중도 유지/소폭 상승
    frownStart = null;
    concScore    = Math.min(100, concScore + 1);
    concSmoothed = Math.round((concSmoothed * 3 + concScore) / 4);
    updateConcUI();
    return;
  }
  const lms = res.multiFaceLandmarks[0];

  // EAR — 졸음 감지 (0.15: 실제로 눈이 감길 때만)
  const d = (a, b) => Math.hypot(lms[a].x - lms[b].x, lms[a].y - lms[b].y);
  const earL = (d(160,144) + d(158,153)) / (2 * d(33,133));
  const earR = (d(385,380) + d(387,373)) / (2 * d(362,263));
  const ear  = (earL + earR) / 2;
  const drowsy = ear < 0.15;

  // 좌우 시선 이탈만 감지 (pitch 제외 — 교재 볼 때 고개 숙임 허용)
  const faceW = lms[454].x - lms[234].x;
  const yaw   = faceW > 0 ? (lms[1].x - (lms[234].x + lms[454].x) / 2) / (faceW / 2) : 0;
  const sideDistracted = Math.abs(yaw) > 0.45;

  // 눈썹 찌푸림 — 자동 개입 판단용만 사용 (집중도 수치에 영향 없음)
  const lb = lms[55], rb = lms[285], nose = lms[168];
  const browDist   = Math.abs(lb.x - rb.x);
  const browToNose = ((lb.y + rb.y) / 2) - nose.y;
  const frowning   = browDist < 0.09 && browToNose < 0.045;
  checkFrownIntervention(frowning);

  // 집중도 계산: 카메라를 보거나 교재에 집중 = 높은 점수
  const delta  = drowsy ? -5 : sideDistracted ? -2 : +3;
  concScore    = Math.min(100, Math.max(0, concScore + delta));
  concSmoothed = Math.round((concSmoothed * 3 + concScore) / 4);

  updateConcUI();
}

function updateConcUI() {
  const badge = document.getElementById('conc-badge');
  badge.style.display  = 'inline';
  badge.textContent    = `집중 ${concSmoothed}%`;
  badge.style.background =
    concSmoothed >= 70 ? 'rgba(39,174,96,0.32)' :
    concSmoothed >= 40 ? 'rgba(243,156,18,0.32)' : 'rgba(220,50,47,0.32)';
  badge.style.color =
    concSmoothed >= 70 ? '#8ef' :
    concSmoothed >= 40 ? '#fd7' : '#f88';
}

// ══════════════════════════════════════════════
//  자동 개입 — 뮤텍스, 쿨다운, 유예 기간 포함
// ══════════════════════════════════════════════
function canIntervene() {
  if (isClassMode) return false;                               // 집체교육 중 차단
  if (isInterventionActive) return false;                      // 이미 개입 중 차단
  if (Date.now() - PAGE_LOAD_TIME < GRACE_PERIOD) return false; // 초기 30s 유예
  return true;
}

// 교육생 입력 시 호출 — 개입 플래그 해제 + 60s 타이머 리셋
function onUserActivity() {
  isInterventionActive = false;
  resetIdleTimer();
}

function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(triggerIdleIntervention, IDLE_DELAY);
}

function triggerIdleIntervention() {
  if (!canIntervene()) return;
  if (Date.now() - lastIdleIntervention < IDLE_COOLDOWN) return; // 5분 쿨다운
  isInterventionActive = true;
  lastIdleIntervention = Date.now();
  const msg = '혹시 어려운 부분 있으신가요? 편하게 물어보세요!';
  waveAnim();
  addMessage('tutor', msg);
  speak(msg);
  // 타이머 재시작 없음 — 교육생이 응답할 때 onUserActivity()가 재시작
}

function checkFrownIntervention(frowning) {
  const now = Date.now();
  if (frowning) {
    if (!frownStart) {
      frownStart = now;
    } else if (now - frownStart >= FROWN_DURATION) {  // 5s 연속
      if (!canIntervene()) return;
      if (now - lastFrownIntervention < FROWN_COOLDOWN) return; // 10분 쿨다운
      frownStart = null;
      isInterventionActive  = true;
      lastFrownIntervention = now;
      const msg = '뭔가 헷갈리시는 것 같은데, 어떤 부분이 어려우세요?';
      waveAnim();
      addMessage('tutor', msg);
      speak(msg);
    }
  } else {
    frownStart = null;
  }
}

function esc(s) {

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

// ══════════════════════════════════════════════
//  AI 캐릭터 드래그 이동
// ══════════════════════════════════════════════
function initCharDrag() {
  const el = document.getElementById('char-container');

  // 저장된 위치 복원 (없으면 CSS top:0; right:0 기본값 유지)
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('charPos')); } catch {}
  if (saved) {
    el.style.right = 'auto';
    el.style.left  = saved.left + 'px';
    el.style.top   = saved.top  + 'px';
  }

  let dragging = false, startX, startY, startLeft, startTop;

  function onDragStart(e) {
    dragging = true;
    const p    = e.touches?.[0] ?? e;
    startX     = p.clientX;
    startY     = p.clientY;
    const rect = el.getBoundingClientRect();
    startLeft  = rect.left;
    startTop   = rect.top;
    // right 기반 → left 기반으로 전환
    el.style.right = 'auto';
    el.style.left  = startLeft + 'px';
    el.style.top   = startTop  + 'px';
    el.style.opacity   = '0.8';
    el.style.animation = 'none';
    e.preventDefault();
  }

  function onDragMove(e) {
    if (!dragging) return;
    const p      = e.touches?.[0] ?? e;
    const maxL   = window.innerWidth  - el.offsetWidth;
    const maxT   = window.innerHeight - el.offsetHeight;
    const newL   = Math.min(maxL, Math.max(0, startLeft + p.clientX - startX));
    const newT   = Math.min(maxT, Math.max(0, startTop  + p.clientY - startY));
    el.style.left = newL + 'px';
    el.style.top  = newT + 'px';
    e.preventDefault();
  }

  function onDragEnd() {
    if (!dragging) return;
    dragging = false;
    el.style.opacity = '1';
    const rect = el.getBoundingClientRect();
    try { localStorage.setItem('charPos', JSON.stringify({ left: rect.left, top: rect.top })); } catch {}
  }

  el.addEventListener('mousedown',  onDragStart);
  el.addEventListener('touchstart', onDragStart, { passive: false });
  window.addEventListener('mousemove',  onDragMove);
  window.addEventListener('touchmove',  onDragMove, { passive: false });
  window.addEventListener('mouseup',    onDragEnd);
  window.addEventListener('touchend',   onDragEnd);
}
</script>
</body>
</html>
