<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AI 교관</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

  <!-- MediaPipe FaceMesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ── 카메라 배경 ── */
    #cam-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0;
    }
    .cam-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.38);
      z-index: 1;
    }

    /* ── 상단바 ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.72), transparent);
    }
    #back-btn {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 0.32rem 0.75rem;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }
    #page-title { font-size: 0.88rem; font-weight: bold; flex: 1; }
    .top-badge {
      font-size: 0.66rem;
      padding: 0.18rem 0.5rem;
      border-radius: 2rem;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }
    #unit-label { background: rgba(79,142,247,0.35); color: #acd; }
    #conc-badge { background: rgba(39,174,96,0.32); color: #8ef; display: none; }
    .top-icon-btn {
      width: 32px; height: 32px;
      border: none; border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: #fff; font-size: 0.95rem;
      cursor: pointer; flex-shrink: 0;
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
    }

    /* ── 집체교육 배너 ── */
    #class-banner {
      position: fixed;
      top: 3.2rem; left: 0; right: 0;
      z-index: 19;
      background: rgba(220,50,47,0.88);
      color: #fff;
      text-align: center;
      padding: 0.38rem;
      font-size: 0.8rem;
      font-weight: bold;
      backdrop-filter: blur(6px);
      display: none;
    }

    /* ── 채팅창 (좌측 하단) ── */
    #chat-window {
      position: fixed;
      bottom: 0.8rem;
      left: 0.65rem;
      width: 61%;
      max-height: 44vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
    }

    /* 빠른 질문 버튼 */
    #quick-btns {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 0.05rem;
    }
    #quick-btns::-webkit-scrollbar { display: none; }
    .qq-btn {
      white-space: nowrap;
      padding: 0.28rem 0.65rem;
      background: rgba(79,142,247,0.28);
      color: #cde;
      border: 1px solid rgba(79,142,247,0.45);
      border-radius: 2rem;
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
      backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
    }
    .qq-btn:active { background: rgba(79,142,247,0.5); }

    /* 메시지 목록 */
    #chat-messages {
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(12px);
      border-radius: 1rem;
      padding: 0.6rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      overflow-y: auto;
      max-height: 28vh;
      min-height: 56px;
    }
    .msg { display: flex; flex-direction: column; max-width: 88%; }
    .msg.tutor { align-self: flex-start; }
    .msg.user  { align-self: flex-end; }
    .msg .sender { font-size: 0.6rem; color: rgba(255,255,255,0.45); margin-bottom: 0.12rem; }
    .msg.user .sender { text-align: right; }
    .msg .bubble {
      padding: 0.42rem 0.62rem;
      border-radius: 0.72rem;
      font-size: 0.78rem;
      line-height: 1.44;
    }
    .msg.tutor .bubble {
      background: rgba(79,142,247,0.32);
      border-bottom-left-radius: 0.15rem;
      color: #e8f4ff;
    }
    .msg.user .bubble {
      background: rgba(255,255,255,0.18);
      border-bottom-right-radius: 0.15rem;
      color: #fff;
    }
    .typing-dots {
      display: flex; gap: 4px; padding: 0.42rem 0.62rem;
      background: rgba(79,142,247,0.25); border-radius: 0.72rem; width: fit-content;
    }
    .typing-dots span {
      width: 6px; height: 6px; background: #7ab; border-radius: 50%;
      animation: tdot 1s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot { 0%,80%,100%{opacity:0.25} 40%{opacity:1} }

    /* 입력창 */
    #chat-input-row {
      display: flex;
      gap: 0.38rem;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      padding: 0.48rem 0.72rem;
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 1.5rem;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      resize: none;
      max-height: 60px;
      line-height: 1.4;
    }
    #chat-input::placeholder { color: rgba(255,255,255,0.35); }
    #chat-input:focus { border-color: rgba(79,142,247,0.6); }
    #send-btn {
      width: 34px; height: 34px; flex-shrink: 0;
      background: #4f8ef7; border: none; border-radius: 50%;
      color: #fff; font-size: 0.88rem; cursor: pointer;
    }

    /* ── AI 캐릭터 (우측 상단) ── */
    #char-container {
      position: fixed;
      top: 80px; right: 10px;
      z-index: 15;
      width: 44%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
      animation: slideDown 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      background: transparent !important;
      background-color: transparent !important;
    }
    @keyframes slideDown {
      from { transform: translateY(-60px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    /* 캐릭터 이미지 */
    #char-img {
      width: 100%;
      height: 42vh;
      object-fit: contain;
      object-position: top center;
      user-select: none;
      -webkit-user-drag: none;
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }
    #char-fallback {
      font-size: 11vh;
      text-align: center;
      padding-top: 0.5rem;
      display: none;
      background: transparent !important;
    }

    /* ── PTT 버튼 (버튼식 모드) ── */
    #ptt-wrap {
      position: fixed;
      bottom: 0.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: none;
      justify-content: center;
    }
    #ptt-btn {
      padding: 0.75rem 1.8rem;
      background: rgba(79,142,247,0.82);
      color: #fff;
      border: 2px solid rgba(79,142,247,0.9);
      border-radius: 3rem;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(79,142,247,0.38);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background 0.15s, box-shadow 0.15s;
    }
    #ptt-btn.active {
      background: rgba(220,50,47,0.85);
      border-color: rgba(220,50,47,0.9);
      box-shadow: 0 4px 18px rgba(220,50,47,0.4);
      animation: pttPulse 0.65s ease-in-out infinite;
    }
    @keyframes pttPulse { 0%,100%{opacity:1} 50%{opacity:0.65} }

    /* ── 마이크 상태 인디케이터 ── */
    #mic-dot {
      position: fixed;
      top: 3rem; right: 0.7rem;
      z-index: 20;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #27ae60;
      animation: micBlink 1.8s ease-in-out infinite;
      display: none;
    }
    @keyframes micBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    #listening-label {
      position: fixed;
      bottom: 4.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(220,50,47,0.82);
      color: #fff;
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.74rem;
      display: none;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>

<video id="cam-video" autoplay muted playsinline></video>
<div class="cam-overlay"></div>

<!-- 상단바 -->
<div id="top-bar">
  <button id="back-btn" onclick="goHome()">← 홈</button>
  <div id="page-title">🤖 AI 교관</div>
  <span class="top-badge" id="unit-label">1단원</span>
  <span class="top-badge" id="conc-badge">집중 100%</span>
  <button class="top-icon-btn" id="mic-mode-btn" onclick="toggleMicMode()" title="마이크 모드 전환">🎤</button>
  <button class="top-icon-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
  <button onclick="SessionManager.logout()" style="
    background:rgba(255,255,255,0.10);color:#888;
    border:1px solid rgba(255,255,255,0.14);border-radius:2rem;
    padding:0.28rem 0.65rem;font-size:0.7rem;cursor:pointer;
    flex-shrink:0;backdrop-filter:blur(6px);white-space:nowrap;">로그아웃</button>
</div>

<!-- 집체교육 배너 -->
<div id="class-banner">🏫 집체교육 중 — 음성 자동 음소거</div>

<!-- 마이크 상태 -->
<div id="mic-dot"></div>
<div id="listening-label">🎤 듣는 중...</div>

<!-- 채팅창 (좌측 하단) -->
<div id="chat-window">
  <div id="quick-btns">
    <button class="qq-btn" onclick="askQuick('신호수란 무엇인가요?')">신호수란?</button>
    <button class="qq-btn" onclick="askQuick('정지신호 방법을 알려주세요')">정지신호 방법</button>
    <button class="qq-btn" onclick="askQuick('진행신호 방법을 알려주세요')">진행신호 방법</button>
    <button class="qq-btn" onclick="askQuick('오늘 배운 내용을 복습해주세요')">오늘 복습하기</button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <textarea id="chat-input" placeholder="질문 입력..." rows="1"></textarea>
    <button id="send-btn" onclick="sendText()">➤</button>
  </div>
</div>

<!-- AI 캐릭터 (우측 상단) -->
<div id="char-container">
  <img id="char-img"
    src="../assets/instructor_idle.png?v=2"
    alt="AI 교관"
    onerror="this.style.display='none';document.getElementById('char-fallback').style.display='block'">
  <div id="char-fallback">🪖</div>
</div>

<!-- PTT 버튼 -->
<div id="ptt-wrap">
  <button id="ptt-btn">🎤 누르고 말하기</button>
</div>

<!-- 의존 스크립트 -->
<script src="../js/config.js"></script>
<script src="../js/session-manager.js"></script>
<script src="../js/firebase-manager.js"></script>
<script src="../js/data-manager.js"></script>

<script>
// ══════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════
let session       = null;
let isClassMode   = false;
let isMuted       = false;
let micMode       = localStorage.getItem('tutorMicMode') || 'vad';
let recognition   = null;
let isRecognizing = false;
let isSpeaking    = false;
let talkInterval  = null;
let currentVoice  = null;
let frownStart    = null;
let idleTimer     = null;
let sessionStart  = Date.now();
let curriculum    = null;
let messages      = [];      // {type, text}[]
let cameraStream  = null;
let lastConcSent  = 0;

// ── 자동 개입 상태 ──
let isInterventionActive  = false;
let lastFrownIntervention = 0;
let lastIdleIntervention  = 0;
const PAGE_LOAD_TIME = Date.now();
const IDLE_DELAY     = 60000;   // 60s 무입력 후 개입
const IDLE_COOLDOWN  = 300000;  // 개입 후 5분 대기
const FROWN_DURATION = 5000;    // 5s 연속 찌푸림
const FROWN_COOLDOWN = 600000;  // 개입 후 10분 대기
const GRACE_PERIOD   = 30000;   // 페이지 로드 후 30s 유예

const charImg = document.getElementById('char-img');

// ══════════════════════════════════════════════
//  Boot
// ══════════════════════════════════════════════
SessionManager.requireSession(async s => {
  session = s;

  document.getElementById('unit-label').textContent = `${s.currentUnit || 1}단원`;

  initVoices();
  initSpeechRecognition();
  await startCamera();

  await FirebaseManager.init();
  FirebaseManager.watchInstructorMode(active => {
    isClassMode = active;
    document.getElementById('class-banner').style.display = active ? 'block' : 'none';
    if (active && isSpeaking) stopSpeak();
  });

  loadCurriculum();
  updateMicModeUI();

  // 인사
  const days = SessionManager.getDaysSinceLastAccess();
  setTimeout(() => {
    if (days >= 3) {
      greet(`오랜만이에요! ${days}일 만에 오셨군요. ` +
            `저번에 ${s.currentUnit || 1}단원까지 하셨는데, 핵심만 30초 복습하고 시작할까요?`);
    } else {
      greet(`안녕하세요, ${s.name}님! 무엇이든 궁금한 것을 물어보세요 😊`);
    }
  }, 700);

  resetIdleTimer();

  window.addEventListener('beforeunload', () => {
    DataManager.addStudyTime(Math.round((Date.now() - sessionStart) / 1000));
  });
});

// ══════════════════════════════════════════════
//  TTS
// ══════════════════════════════════════════════
function initVoices() {
  const load = () => {
    const voices = window.speechSynthesis.getVoices();
    currentVoice =
      voices.find(v => v.lang === 'ko-KR' && /female|woman|여성|미/i.test(v.name)) ||
      voices.find(v => v.lang === 'ko-KR') ||
      voices.find(v => v.lang.startsWith('ko')) ||
      null;
  };
  load();
  window.speechSynthesis.onvoiceschanged = load;
}

function speak(text) {
  if (!window.speechSynthesis || isMuted || isClassMode) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = 'ko-KR';
  utt.rate  = 0.92;
  utt.pitch = 1.05;
  if (currentVoice) utt.voice = currentVoice;
  utt.onstart = () => {
    isSpeaking = true;
    startTalkAnim();
    if (micMode === 'vad') stopRecognition();
  };
  utt.onend = utt.onerror = () => {
    isSpeaking = false;
    stopTalkAnim();
    if (micMode === 'vad') setTimeout(startRecognition, 400);
  };
  window.speechSynthesis.speak(utt);
}

function stopSpeak() {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  stopTalkAnim();
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
  if (isMuted) stopSpeak();
}

// ══════════════════════════════════════════════
//  캐릭터 애니메이션
// ══════════════════════════════════════════════
const CHAR = {
  idle: '../assets/instructor_idle.png?v=2',
  talk: '../assets/instructor_talk.png?v=2',
  wave: '../assets/instructor_wave.png?v=2',
};

function setChar(state) {
  charImg.src = CHAR[state] || CHAR.idle;
}

function startTalkAnim() {
  if (talkInterval) return;
  let t = false;
  talkInterval = setInterval(() => { setChar(t ? 'talk' : 'idle'); t = !t; }, 300);
}

function stopTalkAnim() {
  clearInterval(talkInterval);
  talkInterval = null;
  setChar('idle');
}

function waveAnim(cb) {
  stopTalkAnim();
  setChar('wave');
  setTimeout(() => { setChar('idle'); if (cb) cb(); }, 2000);
}

function greet(text) {
  waveAnim();
  addMessage('tutor', text);
  speak(text);
}

// ══════════════════════════════════════════════
//  STT
// ══════════════════════════════════════════════
function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  recognition = new SR();
  recognition.lang            = 'ko-KR';
  recognition.continuous      = true;
  recognition.interimResults  = true;

  recognition.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const t = e.results[i][0].transcript.trim();
        if (t) handleUserInput(t);
      }
    }
  };
  recognition.onerror = () => {
    isRecognizing = false;
    if (micMode === 'vad') setTimeout(startRecognition, 1200);
  };
  recognition.onend = () => {
    isRecognizing = false;
    if (micMode === 'vad' && !isSpeaking) setTimeout(startRecognition, 400);
  };
}

function startRecognition() {
  if (!recognition || isRecognizing || isSpeaking) return;
  try { recognition.start(); isRecognizing = true; } catch {}
}

function stopRecognition() {
  if (!recognition || !isRecognizing) return;
  try { recognition.stop(); isRecognizing = false; } catch {}
}

// ══════════════════════════════════════════════
//  마이크 모드 (VAD / PTT)
// ══════════════════════════════════════════════
function toggleMicMode() {
  micMode = micMode === 'vad' ? 'ptt' : 'vad';
  localStorage.setItem('tutorMicMode', micMode);
  stopRecognition();
  updateMicModeUI();
}

function updateMicModeUI() {
  const modeBtn  = document.getElementById('mic-mode-btn');
  const pttWrap  = document.getElementById('ptt-wrap');
  const micDot   = document.getElementById('mic-dot');

  if (micMode === 'vad') {
    modeBtn.textContent = '🎤';
    modeBtn.title = '상시 감지 모드 (클릭 → 버튼식으로 전환)';
    pttWrap.style.display = 'none';
    micDot.style.display  = 'block';
    startRecognition();
  } else {
    modeBtn.textContent = '👆';
    modeBtn.title = '버튼식 모드 (클릭 → 상시 감지로 전환)';
    pttWrap.style.display = 'flex';
    micDot.style.display  = 'none';
    stopRecognition();
  }
}

// PTT 이벤트
const pttBtn = document.getElementById('ptt-btn');

function pttDown(e) {
  if (micMode !== 'ptt') return;
  e.preventDefault();
  pttBtn.classList.add('active');
  pttBtn.textContent = '🔴 녹음 중...';
  document.getElementById('listening-label').style.display = 'block';
  startRecognition();
}
function pttUp(e) {
  if (micMode !== 'ptt') return;
  e.preventDefault();
  pttBtn.classList.remove('active');
  pttBtn.textContent = '🎤 누르고 말하기';
  document.getElementById('listening-label').style.display = 'none';
  stopRecognition();
}
pttBtn.addEventListener('touchstart', pttDown, { passive: false });
pttBtn.addEventListener('touchend',   pttUp,   { passive: false });
pttBtn.addEventListener('touchcancel',pttUp,   { passive: false });
pttBtn.addEventListener('mousedown',  pttDown);
pttBtn.addEventListener('mouseup',    pttUp);
pttBtn.addEventListener('mouseleave', pttUp);

// ══════════════════════════════════════════════
//  채팅 메시지
// ══════════════════════════════════════════════
const MAX_MSGS = 5;

function addMessage(type, text, isTyping = false) {
  if (!isTyping) {
    messages.push({ type, text });
    if (messages.length > MAX_MSGS) messages.shift();
  }
  renderMessages(isTyping);
}

function renderMessages(showTyping = false) {
  const el = document.getElementById('chat-messages');
  const html = messages.map(m => `
    <div class="msg ${m.type}">
      <div class="sender">${m.type === 'tutor' ? '🤖 교관' : '👤 나'}</div>
      <div class="bubble">${esc(m.text)}</div>
    </div>`).join('');
  const typing = showTyping
    ? `<div class="msg tutor"><div class="sender">🤖 교관</div>
       <div class="typing-dots"><span></span><span></span><span></span></div></div>`
    : '';
  el.innerHTML = html + typing;
  el.scrollTop = el.scrollHeight;
}

function sendText() {
  const inp = document.getElementById('chat-input');
  const t   = inp.value.trim();
  if (!t) return;
  inp.value = '';
  inp.style.height = 'auto';
  handleUserInput(t);
}

function askQuick(text) { handleUserInput(text); }

// ══════════════════════════════════════════════
//  AI 답변
// ══════════════════════════════════════════════
async function handleUserInput(text) {
  onUserActivity();           // 개입 플래그 해제 + 타이머 리셋
  addMessage('user', text);

  // VAD 모드면 처리 중 인식 중단
  if (micMode === 'vad') stopRecognition();

  // 타이핑 인디케이터 표시
  renderMessages(true);

  const answer = await getAiResponse(text);

  addMessage('tutor', answer);
  speak(answer);

  // 데이터 저장
  if (session) {
    DataManager.saveProgress({ lastAiQuery: text, lastAiResponse: answer.slice(0, 120) });
  }
}

async function getAiResponse(query) {
  // 1. Gemini Nano
  if (window.ai?.languageModel) {
    try {
      const ai = await window.ai.languageModel.create({
        systemPrompt:
          '당신은 신호수 교육 전문 AI 교관입니다. 교육생이 신호수 교재를 공부하다 모르는 것을 물어봅니다. ' +
          '친근하고 명확하게, 짧고 핵심만 답변하세요. 모르는 내용은 교재를 확인하라고 안내하세요.'
      });
      const res = await Promise.race([
        ai.prompt(query),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))
      ]);
      ai.destroy();
      return res;
    } catch {}
  }

  // 2. 키워드 매칭 fallback
  return await curriculumAnswer(query);
}

async function loadCurriculum() {
  if (curriculum) return;
  try {
    const r = await fetch('../data/curriculum.json');
    curriculum = await r.json();
  } catch {}
}

async function curriculumAnswer(query) {
  await loadCurriculum();
  const lower = query.toLowerCase();

  const MAP = [
    { k:['신호수란','신호수가 뭐','신호수 뭐','역할이','하는 일','무엇'],
      a:'신호수는 건설현장에서 크레인·지게차 같은 중장비 운전자와 현장 작업자 사이에서 안전한 신호를 전달하는 역할을 합니다. 운전자의 사각지대를 감시하고 위험을 미리 차단하는 핵심 인원이에요!' },
    { k:['정지','멈춰','보권','빨간'],
      a:'정지 신호는 빨간 보권(깃발)을 머리 위로 올려 좌우로 크게 흔듭니다. 긴급 정지는 양팔을 X자로 교차하면 됩니다. 빨간색 = 위험·정지예요!' },
    { k:['진행','가도','주권','노란'],
      a:'진행 신호는 노란 주권을 앞으로 뻗어 전방을 지시합니다. 진행 허가 전에 반드시 전방 안전을 확인하세요. 노란색 = 진행·서행!' },
    { k:['위로','올리기','상승','올려'],
      a:'위로 올리기 신호는 팔을 아래에서 위로 크게 올리는 동작입니다. 장비 상승·전진을 지시할 때 사용하며, 팔꿈치를 완전히 펴서 크게 해주세요!' },
    { k:['아래로','내리기','하강','내려'],
      a:'아래로 내리기 신호는 팔을 위에서 아래로 내리는 동작입니다. 장비 하강·정지를 지시할 때 사용합니다.' },
    { k:['수평','좌우','이동 방향'],
      a:'수평 이동 신호는 팔을 수평으로 펼쳐 이동 방향을 지시합니다. 이동 방향의 팔을 뻗고, 정지할 때는 주먹을 쥐어 신호하세요!' },
    { k:['천천히','서행','느리게','조금씩'],
      a:'서행 신호는 팔을 천천히 위아래로 움직이거나 손바닥을 아래로 밀어내는 동작입니다. 위험 구역 진입 전에 반드시 사용하세요!' },
    { k:['복장','조끼','안전모','옷'],
      a:'신호수는 형광 조끼와 안전모를 반드시 착용해야 합니다. 빨강·주황 형광 조끼를 권장하며, 다른 작업자와 명확히 구분되어야 합니다.' },
    { k:['위치','어디','서야','장소'],
      a:'신호수는 운전자가 항상 볼 수 있는 위치에 있어야 합니다. 장비 이동 경로와 선회 반경 밖의 안전한 위치를 선택하세요!' },
    { k:['긴급','비상','사고'],
      a:'긴급 정지 신호는 보권을 머리 위에서 크게 흔들거나 양팔 X자 교차입니다. 누구나 발신할 수 있으며, 장비가 완전히 멈출 때까지 신호를 유지하세요!' },
    { k:['복습','정리','요약','오늘'],
      a:`핵심 정리 드릴게요! ① 신호수 = 운전자↔작업자 안전 신호 전달 ② 보권(빨강) = 정지·위험 ③ 주권(노랑) = 진행·서행 ④ 신호수는 항상 장비 이동 경로 밖에 위치해야 합니다. 더 궁금한 부분이 있으면 물어보세요!` },
    { k:['자격','시험','교육'],
      a:'신호수 자격은 건설기계 안전운전 신호수 교육을 이수해야 합니다. 이 앱으로 꾸준히 연습하면 실습 시험에서 좋은 결과를 얻을 수 있어요!' },
  ];

  for (const item of MAP) {
    if (item.k.some(k => lower.includes(k))) return item.a;
  }

  // curriculum.json 검색
  if (curriculum?.units) {
    let best = null, bestScore = 0;
    for (const unit of curriculum.units) {
      let score = 0;
      const words = lower.split(/\s+/).filter(w => w.length >= 2);
      if (words.some(w => (unit.title || '').includes(w))) score += 4;
      for (const c of (unit.content || [])) {
        for (const w of words) {
          if ((c.text || '').includes(w)) score += 1;
          for (const kp of (c.keyPoints || [])) if (kp.includes(w)) score += 2;
        }
      }
      if (score > bestScore) { bestScore = score; best = unit; }
    }
    if (best && bestScore >= 2) {
      const c = best.content[0];
      const kps = (c.keyPoints || []).slice(0, 2).join(' · ');
      return `${best.title}에 대한 내용이에요! ${c.text || ''} ${kps ? '핵심: ' + kps : ''}`;
    }
  }

  return `"${query}"에 대해서는 해당 단원 교재를 다시 확인해보세요. 더 구체적으로 어떤 부분이 궁금하신가요?`;
}

// ══════════════════════════════════════════════
//  카메라 & FaceMesh
// ══════════════════════════════════════════════
async function startCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    const v = document.getElementById('cam-video');
    v.srcObject = cameraStream;
    await v.play().catch(() => {});
    initFaceMesh(v);
  } catch (e) {
    console.warn('[Camera]', e.message);
  }
}

function initFaceMesh(videoEl) {
  if (typeof FaceMesh === 'undefined') return;

  const fm = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });
  fm.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  fm.onResults(onFaceResults);

  // requestAnimationFrame으로 기존 스트림 재사용 (Camera 유틸 대신)
  let lastMs = 0;
  function loop() {
    requestAnimationFrame(loop);
    if (!videoEl.readyState || videoEl.paused || !videoEl.videoWidth) return;
    const now = performance.now();
    if (now - lastMs < 250) return; // ~4 fps (face detection)
    lastMs = now;
    fm.send({ image: videoEl }).catch(() => {});
  }
  loop();
}

function onFaceResults(res) {
  if (!res.multiFaceLandmarks?.length) {
    frownStart = null; return;
  }
  const lms = res.multiFaceLandmarks[0];

  // 눈썹 찌푸림: 좌(55) 우(285) 내측 눈썹 거리 + 코 기준(168)
  const lb = lms[55], rb = lms[285], nose = lms[168];
  if (!lb || !rb || !nose) return;

  const browDist   = Math.abs(lb.x - rb.x);          // 내측 눈썹 수평 거리
  const browToNose = ((lb.y + rb.y) / 2) - nose.y;   // 눈썹-코 수직 거리
  const frowning   = browDist < 0.09 && browToNose < 0.045;

  checkFrownIntervention(frowning);

  // 집중도 점수 (졸음: 눈 꺼짐 추정 - 눈 높이로 간이 측정)
  const leftEyeH  = Math.abs((lms[159]?.y || 0) - (lms[145]?.y || 0));
  const rightEyeH = Math.abs((lms[386]?.y || 0) - (lms[374]?.y || 0));
  const eyeOpen   = (leftEyeH + rightEyeH) / 2;
  const drowsy    = eyeOpen < 0.012;
  const score     = drowsy ? 30 : frowning ? 60 : 90;

  const concBadge = document.getElementById('conc-badge');
  concBadge.style.display = 'inline';
  concBadge.textContent = `집중 ${score}%`;
  concBadge.style.background =
    score >= 70 ? 'rgba(39,174,96,0.32)' :
    score >= 40 ? 'rgba(243,156,18,0.32)' : 'rgba(220,50,47,0.32)';

  const now = Date.now();
  if (now - lastConcSent > 12000 && session) {
    lastConcSent = now;
    FirebaseManager.updateConcentration(session.studentId, score).catch(() => {});
  }
}

// ══════════════════════════════════════════════
//  자동 개입 — 뮤텍스, 쿨다운, 유예 기간 포함
// ══════════════════════════════════════════════
function canIntervene() {
  if (isClassMode) return false;                               // 집체교육 중 차단
  if (isInterventionActive) return false;                      // 이미 개입 중 차단
  if (Date.now() - PAGE_LOAD_TIME < GRACE_PERIOD) return false; // 초기 30s 유예
  return true;
}

// 교육생 입력 시 호출 — 개입 플래그 해제 + 60s 타이머 리셋
function onUserActivity() {
  isInterventionActive = false;
  resetIdleTimer();
}

function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(triggerIdleIntervention, IDLE_DELAY);
}

function triggerIdleIntervention() {
  if (!canIntervene()) return;
  if (Date.now() - lastIdleIntervention < IDLE_COOLDOWN) return; // 5분 쿨다운
  isInterventionActive = true;
  lastIdleIntervention = Date.now();
  const msg = '혹시 어려운 부분 있으신가요? 편하게 물어보세요! 😊';
  waveAnim();
  addMessage('tutor', msg);
  speak(msg);
  // 타이머 재시작 없음 — 교육생이 응답할 때 onUserActivity()가 재시작
}

function checkFrownIntervention(frowning) {
  const now = Date.now();
  if (frowning) {
    if (!frownStart) {
      frownStart = now;
    } else if (now - frownStart >= FROWN_DURATION) {  // 5s 연속
      if (!canIntervene()) return;
      if (now - lastFrownIntervention < FROWN_COOLDOWN) return; // 10분 쿨다운
      frownStart = null;
      isInterventionActive  = true;
      lastFrownIntervention = now;
      const msg = '뭔가 헷갈리시는 것 같은데, 어떤 부분이 어려우세요?';
      waveAnim();
      addMessage('tutor', msg);
      speak(msg);
    }
  } else {
    frownStart = null;
  }
}

// ══════════════════════════════════════════════
//  네비게이션
// ══════════════════════════════════════════════
function goHome() {
  stopSpeak();
  stopRecognition();
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  DataManager.addStudyTime(Math.round((Date.now() - sessionStart) / 1000));
  location.href = './home.html';
}

// ══════════════════════════════════════════════
//  채팅 입력 UI
// ══════════════════════════════════════════════
const chatInput = document.getElementById('chat-input');
chatInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 64) + 'px';
});
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

// ══════════════════════════════════════════════
//  Util
// ══════════════════════════════════════════════
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}
