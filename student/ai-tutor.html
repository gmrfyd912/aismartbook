<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>AI 교관</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    .header { padding: 1rem 1rem 0.6rem; display: flex; align-items: center; gap: 0.7rem; flex-shrink: 0; }
    .header a { color: #4f8ef7; text-decoration: none; font-size: 0.85rem; }
    .header h1 { font-size: 1.1rem; flex: 1; }
    .mode-badge {
      font-size: 0.7rem; padding: 0.25rem 0.6rem; border-radius: 2rem;
      background: rgba(39,174,96,0.18); color: #27ae60;
    }
    .mode-badge.class-mode { background: rgba(231,76,60,0.18); color: #e55; }

    /* 채팅 영역 */
    .chat-area { flex: 1; overflow-y: auto; padding: 0.5rem 1rem; display: flex; flex-direction: column; gap: 0.8rem; }

    .msg { display: flex; gap: 0.6rem; max-width: 88%; }
    .msg.tutor { align-self: flex-start; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }

    .msg .avatar { font-size: 1.5rem; flex-shrink: 0; align-self: flex-end; }
    .msg .bubble {
      padding: 0.7rem 0.9rem; border-radius: 1rem;
      font-size: 0.88rem; line-height: 1.55;
    }
    .msg.tutor .bubble { background: #1a1a2e; border-bottom-left-radius: 0.2rem; }
    .msg.user  .bubble { background: #4f8ef7; color: #fff; border-bottom-right-radius: 0.2rem; }

    .typing-indicator { display: flex; gap: 5px; padding: 0.7rem 0.9rem; background: #1a1a2e; border-radius: 1rem; width: fit-content; }
    .typing-indicator span { width: 7px; height: 7px; background: #555; border-radius: 50%; animation: typing 1s ease-in-out infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }

    /* 하단 교관 캐릭터 + 입력 */
    .bottom-area { flex-shrink: 0; background: rgba(10,10,15,0.95); border-top: 1px solid rgba(255,255,255,0.07); }

    .tutor-character { display: flex; align-items: flex-end; gap: 0.6rem; padding: 0.6rem 1rem 0; }
    .tutor-character .char-icon { font-size: 2.8rem; }
    .tutor-character .char-bubble {
      background: #1a1a2e; border-radius: 0.9rem; border-bottom-left-radius: 0.2rem;
      padding: 0.55rem 0.8rem; font-size: 0.78rem; color: #ccc; line-height: 1.4;
      max-width: calc(100% - 4rem); border: 1px solid rgba(79,142,247,0.2);
    }

    .input-row { display: flex; gap: 0.5rem; padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom)); }
    .chat-input {
      flex: 1; padding: 0.7rem 0.9rem; background: #1a1a2e;
      border: 1px solid #333; border-radius: 2rem; color: #fff;
      font-size: 0.9rem; outline: none; resize: none; max-height: 80px;
    }
    .chat-input:focus { border-color: #4f8ef7; }
    .chat-input::placeholder { color: #555; }

    .send-btn, .mic-btn {
      width: 42px; height: 42px; border: none; border-radius: 50%;
      font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .send-btn { background: #4f8ef7; color: #fff; }
    .mic-btn  { background: #1a1a2e; color: #888; border: 1px solid #333; }
    .mic-btn.listening { background: #e74c3c; color: #fff; border-color: #e74c3c; animation: micPulse 0.8s ease-in-out infinite; }
    @keyframes micPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    /* 빠른 질문 버튼들 */
    .quick-questions {
      display: flex; gap: 0.5rem; overflow-x: auto; padding: 0 1rem 0.5rem;
      scrollbar-width: none;
    }
    .quick-questions::-webkit-scrollbar { display: none; }
    .qq-btn {
      white-space: nowrap; padding: 0.4rem 0.85rem;
      background: rgba(79,142,247,0.12); color: #4f8ef7;
      border: 1px solid rgba(79,142,247,0.3); border-radius: 2rem;
      font-size: 0.75rem; cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<div class="header">
  <a href="./home.html">← 홈</a>
  <h1>🤖 AI 교관</h1>
  <div class="mode-badge" id="mode-badge">개인학습 모드</div>
</div>

<div class="chat-area" id="chat-area"></div>

<div class="bottom-area">
  <div class="tutor-character">
    <div class="char-icon">🪖</div>
    <div class="char-bubble" id="char-bubble">궁금한 것을 물어보세요!</div>
  </div>

  <div class="quick-questions">
    <button class="qq-btn" onclick="askQuick('신호수의 역할이 뭔가요?')">신호수 역할</button>
    <button class="qq-btn" onclick="askQuick('보권 사용법 알려주세요')">보권 사용법</button>
    <button class="qq-btn" onclick="askQuick('주권 사용법 알려주세요')">주권 사용법</button>
    <button class="qq-btn" onclick="askQuick('신호수 위치는 어디여야 하나요?')">위치 선정</button>
    <button class="qq-btn" onclick="askQuick('긴급 정지 신호 알려주세요')">긴급 정지</button>
    <button class="qq-btn" onclick="askQuick('복장은 어떻게 해야 하나요?')">복장 기준</button>
  </div>

  <div class="input-row">
    <textarea class="chat-input" id="chat-input" placeholder="질문을 입력하세요..." rows="1"></textarea>
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="../js/session-manager.js"></script>
<script src="../js/data-manager.js"></script>
<script src="../js/config.js"></script>
<script src="../js/firebase-manager.js"></script>
<script src="../js/ai-tutor.js"></script>

<script type="module">
  // face-detection은 모듈 방식 import
  const { default: FaceDetectionModule } = await import('../js/face-detection.js').catch(() => ({ default: null }));
</script>

<script>
  let session = null;
  let isClassMode = false;
  let stayTimer = null;
  let frownTimer = null;
  let concUpdateInterval = null;

  SessionManager.requireSession(async (s) => {
    session = s;
    AiTutor.init();

    AiTutor.setOnMessage((type, text) => {
      if (type === 'user')  addMessage('user', text);
      if (type === 'tutor') addMessage('tutor', text, true);
      if (type === 'stt-error') addMessage('tutor', '음성 인식에 실패했습니다. 다시 시도해주세요.');
    });

    // Firebase 강사 모드 감지
    await FirebaseManager.init();
    unsubInstructorMode = FirebaseManager.watchInstructorMode((active) => {
      isClassMode = active;
      AiTutor.setVoiceEnabled(!active);
      const badge = document.getElementById('mode-badge');
      badge.textContent = active ? '집체교육 중 (음성 OFF)' : '개인학습 모드';
      badge.className = 'mode-badge' + (active ? ' class-mode' : '');
    });

    // 인사 메시지
    const days = SessionManager.getDaysSinceLastAccess();
    if (days >= 3) {
      AiTutor.intervene('returnAfterDays', { days, unit: session.currentUnit || 1 });
    } else {
      AiTutor.intervene('greeting', { name: session.name });
    }

    // 30초 체류 감지 (개인학습 모드에서만)
    startStayTimer();

    // 집중도 Firebase 주기적 업데이트 (30초마다)
    concUpdateInterval = setInterval(async () => {
      if (session && typeof FirebaseManager !== 'undefined') {
        const conc = Math.floor(Math.random() * 30) + 70; // FaceDetection 없을 때 기본값
        await FirebaseManager.updateConcentration(session.studentId, conc).catch(() => {});
      }
    }, 30000);
  });

  function startStayTimer() {
    clearTimeout(stayTimer);
    stayTimer = setTimeout(() => {
      if (!isClassMode) AiTutor.intervene('longStay');
    }, 30000);
  }

  function addMessage(type, text, animate = false) {
    const area = document.getElementById('chat-area');

    // 타이핑 인디케이터 제거
    const typing = area.querySelector('.typing-indicator-wrap');
    if (typing) typing.remove();

    if (animate) {
      const ind = document.createElement('div');
      ind.className = 'msg tutor typing-indicator-wrap';
      ind.innerHTML = `<div class="avatar">🪖</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
      area.appendChild(ind);
      area.scrollTop = area.scrollHeight;

      setTimeout(() => {
        ind.remove();
        appendBubble(type, text);
        // 말풍선도 업데이트
        document.getElementById('char-bubble').textContent = text.slice(0, 60) + (text.length > 60 ? '...' : '');
      }, 600);
    } else {
      appendBubble(type, text);
    }
  }

  function appendBubble(type, text) {
    const area = document.getElementById('chat-area');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    if (type === 'tutor') {
      div.innerHTML = `<div class="avatar">🪖</div><div class="bubble">${escHtml(text)}</div>`;
    } else {
      div.innerHTML = `<div class="bubble">${escHtml(text)}</div><div class="avatar">👤</div>`;
    }
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    AiTutor.handleInput(text);
    startStayTimer();
  }

  function askQuick(text) {
    AiTutor.handleInput(text);
    startStayTimer();
  }

  function toggleMic() {
    const btn = document.getElementById('mic-btn');
    if (btn.classList.contains('listening')) {
      AiTutor.stopListening();
      btn.classList.remove('listening');
      btn.textContent = '🎤';
    } else {
      const started = AiTutor.startListening();
      if (started) {
        btn.classList.add('listening');
        btn.textContent = '⏹';
        // STT 완료 후 자동으로 상태 복원
        setTimeout(() => {
          btn.classList.remove('listening');
          btn.textContent = '🎤';
        }, 8000);
      } else {
        addMessage('tutor', '이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.');
      }
    }
  }

  // Enter 전송 (Shift+Enter = 줄바꿈)
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // 자동 높이 조절
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
  });

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }
</script>
</body>
</html>
