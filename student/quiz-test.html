<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>실력 테스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #fff; font-family: sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }

    .header { padding: 1rem 1rem 0.5rem; display: flex; align-items: center; gap: 0.7rem; }
    .header a { color: #4f8ef7; text-decoration: none; font-size: 0.85rem; }
    .header h1 { font-size: 1.1rem; flex: 1; }

    /* 타이머 */
    .timer-bar {
      height: 4px; background: rgba(255,255,255,0.1);
      position: relative; overflow: hidden;
    }
    .timer-fill {
      height: 100%; background: #27ae60;
      transition: width 1s linear, background 0.3s;
    }
    .timer-label {
      text-align: right; padding: 0.3rem 1rem 0.5rem;
      font-size: 0.82rem; color: #888; font-variant-numeric: tabular-nums;
    }

    /* 진행 */
    .progress-wrap { padding: 0 1rem 0.6rem; }
    .progress-row  { display: flex; justify-content: space-between; font-size: 0.78rem; color: #888; margin-bottom: 0.3rem; }
    .progress-dots { display: flex; gap: 4px; }
    .pdot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); }
    .pdot.cur  { background: #4f8ef7; animation: pulse 0.8s ease-in-out infinite; }
    .pdot.pass { background: #27ae60; }
    .pdot.fail { background: #e55; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .question-card {
      margin: 0 1rem; background: #1a1a2e; border-radius: 1.2rem; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .q-num  { font-size: 0.72rem; color: #888; }
    .q-text { font-size: 1.05rem; line-height: 1.6; font-weight: 500; }

    .ox-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: 0.5rem; }
    .ox-btn {
      padding: 1.3rem; border: 2.5px solid transparent;
      border-radius: 1rem; font-size: 2.2rem; font-weight: bold;
      cursor: pointer; background: rgba(255,255,255,0.06);
      color: #fff; transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .ox-btn:active { transform: scale(0.95); }
    .ox-btn.o { border-color: rgba(39,174,96,0.4); }
    .ox-btn.x { border-color: rgba(231,76,60,0.4); }
    .ox-btn:disabled { opacity: 0.5; cursor: default; }

    /* 완료 화면 */
    #complete-screen {
      display: none; flex-direction: column; align-items: center;
      padding: 2rem 1rem; gap: 1.2rem; overflow-y: auto;
    }
    .result-header { text-align: center; }
    .result-header h2 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .result-header .r-score { font-size: 3.5rem; font-weight: bold; }
    .result-header .r-sub   { font-size: 0.85rem; color: #888; }

    .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; width: 100%; }
    .stat-card { background: #1a1a2e; border-radius: 0.8rem; padding: 0.9rem; text-align: center; }
    .stat-card .s-val { font-size: 1.5rem; font-weight: bold; }
    .stat-card .s-lbl { font-size: 0.7rem; color: #888; margin-top: 0.2rem; }

    .result-list { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; }
    .r-item { background: #1a1a2e; border-radius: 0.75rem; padding: 0.8rem 1rem; display: flex; gap: 0.7rem; align-items: flex-start; }
    .r-item .ri-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 0.1rem; }
    .r-item .ri-text { flex: 1; font-size: 0.8rem; line-height: 1.5; color: #ccc; }
    .r-item .ri-badge { font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 1rem; white-space: nowrap; }
    .badge-pass { background: rgba(39,174,96,0.2); color: #27ae60; }
    .badge-fail { background: rgba(231,76,60,0.15); color: #e55; }

    .c-actions { display: flex; gap: 0.7rem; width: 100%; }
    .c-actions button { flex: 1; padding: 0.75rem; border: none; border-radius: 0.8rem; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    .btn-retry  { background: #4f8ef7; color: #fff; }
    .btn-home   { background: #333; color: #ddd; }

    .firebase-badge {
      font-size: 0.72rem; color: #888; padding: 0.4rem 0.8rem;
      background: rgba(255,255,255,0.05); border-radius: 2rem;
    }
  </style>
</head>
<body>

<div id="test-screen" style="display:flex;flex-direction:column;flex:1">
  <div class="header">
    <a href="./home.html">← 홈</a>
    <h1>⏱️ 실력 테스트</h1>
    <span id="sm-user-name" style="font-size:0.72rem;color:#555;flex-shrink:0"></span>
    <button class="sm-logout-btn" onclick="SessionManager.logout()">로그아웃</button>
  </div>

  <div class="timer-bar">
    <div class="timer-fill" id="timer-fill" style="width:100%"></div>
  </div>
  <div class="timer-label" id="timer-label">30초</div>

  <div class="progress-wrap">
    <div class="progress-row">
      <span id="q-counter">1 / 10</span>
      <span id="q-score">맞은 문제: 0</span>
    </div>
    <div class="progress-dots" id="progress-dots"></div>
  </div>

  <div class="question-card">
    <div class="q-num" id="q-num">문제 1</div>
    <div class="q-text" id="q-text">문제를 불러오는 중...</div>
    <div class="ox-row">
      <button class="ox-btn o" id="btn-o" onclick="submitAnswer(true)">⭕</button>
      <button class="ox-btn x" id="btn-x" onclick="submitAnswer(false)">❌</button>
    </div>
  </div>
</div>

<div id="complete-screen">
  <div class="result-header">
    <h2>테스트 완료!</h2>
    <div class="r-score" id="r-score" style="color:#4f8ef7">0점</div>
    <div class="r-sub" id="r-sub"></div>
  </div>

  <div class="result-stats">
    <div class="stat-card">
      <div class="s-val" id="stat-correct" style="color:#27ae60">0</div>
      <div class="s-lbl">정답</div>
    </div>
    <div class="stat-card">
      <div class="s-val" id="stat-wrong" style="color:#e55">0</div>
      <div class="s-lbl">오답</div>
    </div>
    <div class="stat-card">
      <div class="s-val" id="stat-total">0</div>
      <div class="s-lbl">총 문제</div>
    </div>
  </div>

  <div class="result-list" id="result-list"></div>

  <div id="firebase-status" class="firebase-badge" style="display:none">
    📡 강사에게 결과 전송됨
  </div>

  <div class="c-actions">
    <button class="btn-retry" onclick="startTest()">다시 테스트</button>
    <button class="btn-home" onclick="location.href='./home.html'">홈으로</button>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="../js/session-manager.js"></script>
<script src="../js/data-manager.js"></script>
<script src="../js/config.js"></script>
<script src="../js/firebase-manager.js"></script>
<script src="../js/quiz-engine.js"></script>

<script>
  const TIME_PER_Q = 30;
  let results = [];
  let correctCount = 0;
  let timerMax = TIME_PER_Q;

  SessionManager.requireSession(async (session) => {
    document.getElementById('sm-user-name').textContent = session.name;
    await FirebaseManager.init();

    // 이 페이지에 도달했으면 현재 활성 퀴즈를 '처리됨'으로 표시 (배너 재등장 방지)
    const qRef = FirebaseManager.ref('session/activeQuiz');
    if (qRef) {
      qRef.once('value').then(snap => {
        const data = snap.val();
        if (data?.timestamp) localStorage.setItem('handledQuizTs', String(data.timestamp));
      }).catch(() => {});
    }

    await startTest();
  });

  async function startTest() {
    results = [];
    correctCount = 0;
    document.getElementById('test-screen').style.display = 'flex';
    document.getElementById('complete-screen').style.display = 'none';

    const ok = await QuizEngine.init({ count: 10, shuffled: true, quizMode: 'test' });
    if (!ok) {
      document.getElementById('q-text').textContent = '퀴즈를 불러올 수 없습니다.';
      return;
    }
    renderQuestion();
  }

  function renderQuestion() {
    const q = QuizEngine.current();
    if (!q) { showComplete(); return; }

    const idx   = QuizEngine.index();
    const total = QuizEngine.total();

    document.getElementById('q-counter').textContent = `${idx + 1} / ${total}`;
    document.getElementById('q-num').textContent     = `문제 ${idx + 1}`;
    document.getElementById('q-text').textContent    = q.question;
    document.getElementById('q-score').textContent   = `맞은 문제: ${correctCount}`;

    // 진행 도트
    document.getElementById('progress-dots').innerHTML =
      Array.from({ length: total }, (_, i) => {
        if (i < idx)  return `<div class="pdot ${results[i]?.correct ? 'pass' : 'fail'}"></div>`;
        if (i === idx) return `<div class="pdot cur"></div>`;
        return `<div class="pdot"></div>`;
      }).join('');

    document.getElementById('btn-o').disabled = false;
    document.getElementById('btn-x').disabled = false;

    // 타이머 시작
    timerMax = TIME_PER_Q;
    QuizEngine.startTimer(TIME_PER_Q,
      (t) => updateTimer(t),
      ()  => timeOut()
    );
  }

  function updateTimer(t) {
    const pct = (t / timerMax) * 100;
    const fill = document.getElementById('timer-fill');
    fill.style.width = pct + '%';
    fill.style.background = t <= 10 ? '#e74c3c' : t <= 20 ? '#f39c12' : '#27ae60';
    document.getElementById('timer-label').textContent = `${t}초`;
  }

  function timeOut() {
    document.getElementById('btn-o').disabled = true;
    document.getElementById('btn-x').disabled = true;
    // 시간 초과 = 오답 처리
    const result = QuizEngine.answer(null);
    if (result) {
      results.push({ ...result, timedOut: true });
      DataManager.recordWrongAnswer(result.questionId);
    }
    setTimeout(() => {
      const hasNext = QuizEngine.next();
      if (!hasNext) showComplete(); else renderQuestion();
    }, 800);
  }

  function submitAnswer(userAnswer) {
    QuizEngine.clearTimer();
    document.getElementById('btn-o').disabled = true;
    document.getElementById('btn-x').disabled = true;

    const result = QuizEngine.answer(userAnswer);
    if (!result) return;

    results.push(result);
    if (result.correct) correctCount++;
    else DataManager.recordWrongAnswer(result.questionId);

    setTimeout(() => {
      const hasNext = QuizEngine.next();
      if (!hasNext) showComplete(); else renderQuestion();
    }, 300);
  }

  async function showComplete() {
    document.getElementById('test-screen').style.display = 'none';
    document.getElementById('complete-screen').style.display = 'flex';

    const total   = results.length;
    const correct = results.filter(r => r.correct && !r.timedOut).length;
    const score   = total > 0 ? Math.round((correct / total) * 100) : 0;
    const color   = score >= 80 ? '#27ae60' : score >= 60 ? '#f39c12' : '#e55';
    const msg     = score >= 80 ? '우수! 실력이 좋습니다.' :
                    score >= 60 ? '보통. 틀린 문제를 복습하세요.' :
                                  '미흡. AI 튜터과 함께 다시 학습하세요.';

    document.getElementById('r-score').textContent   = score + '점';
    document.getElementById('r-score').style.color   = color;
    document.getElementById('r-sub').textContent     = msg;
    document.getElementById('stat-correct').textContent = correct;
    document.getElementById('stat-wrong').textContent   = total - correct;
    document.getElementById('stat-total').textContent   = total;

    document.getElementById('result-list').innerHTML = results.map(r => `
      <div class="r-item">
        <div class="ri-icon">${r.correct ? '✅' : r.timedOut ? '⏰' : '❌'}</div>
        <div class="ri-text">${r.question?.slice(0, 50) || '?'}${(r.question?.length || 0) > 50 ? '...' : ''}</div>
        <div class="ri-badge ${r.correct ? 'badge-pass' : 'badge-fail'}">${r.correct ? '정답' : r.timedOut ? '시간초과' : '오답'}</div>
      </div>
    `).join('');

    const quizId = 'test_' + Date.now();

    // 학습 데이터 저장
    DataManager.saveQuizResult(quizId, results);

    // Firebase로 강사에게 전송
    const session = SessionManager.get();
    if (session) {
      try {
        await FirebaseManager.saveQuizResult(quizId, session.studentId, {
          name: session.name, score, correct, total, results
        });
        document.getElementById('firebase-status').style.display = 'block';
      } catch {}
    }
  }
</script>
</body>
</html>
