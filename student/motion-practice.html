<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>동작 연습</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #fff; font-family: sans-serif; height: 100dvh; overflow: hidden; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .screen.hidden { display: none !important; }

    /* 선택 화면 */
    #select-screen { background: #0a0a0f; overflow-y: auto; }
    .sel-header { padding: 1rem 1rem 0.5rem; display: flex; align-items: center; gap: 0.7rem; }
    .sel-header a { color: #4f8ef7; text-decoration: none; font-size: 0.85rem; }
    .sel-header h1 { font-size: 1.1rem; flex: 1; }
    .sel-header p  { font-size: 0.78rem; color: #888; padding: 0 1rem 0.8rem; }

    #pose-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; padding: 0 1rem 2rem; }
    .pose-card { background: #1a1a2e; border-radius: 0.9rem; padding: 1rem; cursor: pointer; border: 2px solid transparent; -webkit-tap-highlight-color: transparent; transition: transform 0.1s; }
    .pose-card:active { transform: scale(0.97); }
    .pose-card .icon { font-size: 1.8rem; margin-bottom: 0.3rem; }
    .pose-card .card-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 0.2rem; }
    .pose-card .card-desc { font-size: 0.71rem; color: #888; line-height: 1.3; }

    /* 연습 화면 */
    #practice-screen { background: #000; }
    #cam-wrap { position: absolute; inset: 0; }
    #cam-video  { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #cam-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

    #ref-pip { position: absolute; bottom: 8rem; right: 0.8rem; z-index: 10; width: 110px; border-radius: 0.8rem; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); background: #000; }
    #ref-video { width: 100%; display: block; }
    #ref-pip-label { font-size: 0.62rem; color: #aaa; text-align: center; padding: 0.2rem; background: rgba(0,0,0,0.6); }

    #top-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 0.7rem 0.9rem; background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent); display: flex; align-items: center; justify-content: space-between; }
    #back-btn { background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 2rem; padding: 0.38rem 0.85rem; font-size: 0.8rem; cursor: pointer; backdrop-filter: blur(6px); }
    #pose-title-badge { background: rgba(0,0,0,0.5); padding: 0.32rem 0.85rem; border-radius: 2rem; font-size: 0.85rem; font-weight: bold; backdrop-filter: blur(6px); }

    #no-pose-banner { position: absolute; top: 3.8rem; left: 50%; transform: translateX(-50%); z-index: 8; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.8rem; padding: 0.32rem 0.85rem; border-radius: 2rem; white-space: nowrap; backdrop-filter: blur(6px); pointer-events: none; }
    #no-pose-banner.hidden { display: none; }

    #countdown-overlay { position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); gap: 0.8rem; }
    #countdown-overlay.hidden { display: none; }
    #countdown-number { font-size: 6.5rem; font-weight: bold; color: #fff; animation: pulse 0.9s ease-in-out infinite; text-shadow: 0 0 30px rgba(79,142,247,0.7); }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

    #start-overlay { position: absolute; inset: 0; z-index: 11; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6.5rem; pointer-events: none; }
    #start-overlay.hidden { display: none; }
    #start-btn { pointer-events: all; padding: 0.82rem 2.2rem; background: #4f8ef7; color: #fff; border: none; border-radius: 3rem; font-size: 0.95rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 20px rgba(79,142,247,0.5); animation: float 2s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    /* 점수 패널 */
    #score-panel { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; padding: 0.65rem 1rem 1rem; background: linear-gradient(to top, rgba(0,0,0,0.88) 60%, transparent 100%); }
    #score-row { display: flex; align-items: baseline; gap: 0.35rem; margin-bottom: 0.3rem; }
    #score-number { font-size: 2.7rem; font-weight: bold; line-height: 1; transition: color 0.25s; font-variant-numeric: tabular-nums; }
    #score-unit { font-size: 0.82rem; color: #888; }
    #score-bar-wrap { height: 7px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; margin-bottom: 0.4rem; }
    #score-bar { height: 100%; width: 0%; border-radius: 4px; transition: width 0.2s, background 0.25s; background: #e74c3c; }
    #feedback-text { font-size: 0.82rem; color: #ddd; min-height: 1em; }

    /* AI 피드백 음성 인디케이터 */
    #voice-indicator { position: absolute; bottom: 5.5rem; left: 1rem; z-index: 15; background: rgba(79,142,247,0.85); color: #fff; padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 0.75rem; display: none; backdrop-filter: blur(6px); }

    /* 결과 */
    #result-overlay { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.82); backdrop-filter: blur(8px); }
    #result-overlay.hidden { display: none; }
    #result-box { background: #1a1a2e; border-radius: 1.4rem; padding: 1.7rem 1.8rem; text-align: center; display: flex; flex-direction: column; gap: 0.65rem; align-items: center; width: 86%; max-width: 310px; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from{opacity:0;transform:scale(0.65)} to{opacity:1;transform:scale(1)} }
    #result-icon  { font-size: 2.6rem; }
    #result-score { font-size: 2.8rem; font-weight: bold; }
    #result-msg   { font-size: 0.9rem; color: #ddd; }
    #result-breakdown { width: 100%; background: rgba(255,255,255,0.05); border-radius: 0.6rem; padding: 0.65rem; font-size: 0.76rem; color: #aaa; text-align: left; line-height: 1.7; }
    .result-actions { display: flex; gap: 0.55rem; width: 100%; }
    .result-btn { flex: 1; padding: 0.62rem; border: none; border-radius: 0.75rem; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
    .btn-retry { background: #4f8ef7; color: #fff; }
    .btn-list  { background: #333; color: #ddd; }
  </style>
</head>
<body>

<!-- 선택 화면 -->
<div id="select-screen" class="screen">
  <div class="sel-header">
    <a href="./home.html">← 홈</a>
    <h1>동작 연습</h1>
    <span id="sm-user-name" style="font-size:0.72rem;color:#555;flex-shrink:0"></span>
    <button class="sm-logout-btn" onclick="SessionManager.logout()">로그아웃</button>
  </div>
  <p style="font-size:0.78rem;color:#888;padding:0 1rem 0.8rem">동작을 선택하고 AI 조교의 피드백을 받으세요</p>
  <div id="pose-grid"></div>
</div>

<!-- 연습 화면 -->
<div id="practice-screen" class="screen hidden">
  <div id="cam-wrap">
    <video id="cam-video" autoplay muted playsinline></video>
    <canvas id="cam-canvas"></canvas>
  </div>

  <div id="top-bar">
    <button id="back-btn" onclick="stopPractice()">← 목록</button>
    <div id="pose-title-badge">동작 연습</div>
  </div>

  <div id="no-pose-banner">전신이 카메라에 보이도록 서주세요</div>

  <div id="ref-pip">
    <video id="ref-video" muted playsinline></video>
    <div id="ref-pip-label">참고 동작</div>
  </div>

  <div id="countdown-overlay" class="hidden">
    <div style="font-size:1rem;color:#aaa" id="countdown-pose-name"></div>
    <div id="countdown-number">3</div>
  </div>

  <div id="start-overlay">
    <button id="start-btn" onclick="startCountdown()">▶ 시작</button>
  </div>

  <div id="voice-indicator">🔊 AI 피드백</div>

  <div id="score-panel">
    <div id="score-row">
      <span id="score-number">--</span>
      <span id="score-unit">점</span>
    </div>
    <div id="score-bar-wrap"><div id="score-bar"></div></div>
    <div id="feedback-text">준비되면 시작 버튼을 누르세요</div>
  </div>

  <div id="result-overlay" class="hidden">
    <div id="result-box">
      <div id="result-icon">🎉</div>
      <div id="result-score" style="color:#4f8ef7">85점</div>
      <div id="result-msg">잘 하셨습니다!</div>
      <div id="result-breakdown"></div>
      <div class="result-actions">
        <button class="result-btn btn-retry" onclick="retryPractice()">다시 도전</button>
        <button class="result-btn btn-list"  onclick="stopPractice()">목록으로</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script src="../js/config.js"></script>
<script src="../js/session-manager.js"></script>
<script src="../js/data-manager.js"></script>
<script src="../js/firebase-manager.js"></script>
<script src="../js/ai-tutor.js"></script>
<script src="../js/sheets-manager.js"></script>

<script type="module">
  import { PoseLandmarker, FilesetResolver }
    from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

  let poseLandmarker  = null;
  let poseData        = null;
  let currentPose     = null;
  let currentSeq      = null;
  let cameraStream    = null;
  let rafId           = null;
  let practiceActive  = false;
  let scoreHistory    = [];
  let lastInferenceMs = 0;
  let lastDetectTs    = 0;
  let lastVoiceFeedback = 0;

  const camVideo  = document.getElementById('cam-video');
  const camCanvas = document.getElementById('cam-canvas');
  const ctx       = camCanvas.getContext('2d');
  const refVideo  = document.getElementById('ref-video');
  const offscreen    = document.createElement('canvas');
  const offscreenCtx = offscreen.getContext('2d');

  SessionManager.requireSession(async (session) => {
    document.getElementById('sm-user-name').textContent = session.name;
    AiTutor.init();

    await FirebaseManager.init();
    FirebaseManager.watchClassMode(async active => {
      const name = active ? (await FirebaseManager.getTeacherName() || '교사') : '';
      SheetsManager.setClassContext(active, name);
    });
    AiTutor.setVoiceEnabled(true);

    try {
      const [vision, data] = await Promise.all([
        FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'),
        fetch('../pose-data.json').then(r => r.json())
      ]);
      const mp = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
      const opts = { runningMode:'VIDEO', numPoses:1, minPoseDetectionConfidence:0.3, minPosePresenceConfidence:0.3, minTrackingConfidence:0.3 };
      try {
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, { baseOptions:{ modelAssetPath:mp, delegate:'GPU' }, ...opts });
      } catch {
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, { baseOptions:{ modelAssetPath:mp, delegate:'CPU' }, ...opts });
      }
      const warmup = document.createElement('canvas');
      warmup.width = 4; warmup.height = 4;
      try { poseLandmarker.detectForVideo(warmup, 1); } catch {}
      await new Promise(r => setTimeout(r, 50));
      poseData = data.poses;
      buildSelect();
      setScreen('select');
    } catch (e) {
      alert('AI 모델 초기화 실패: ' + e.message);
    }
  });

  function buildSelect() {
    document.getElementById('pose-grid').innerHTML = poseData.map(p => {
      const ready = p.video && p.sequence;
      return `<div class="pose-card" style="border-color:${p.color}${ready?'44':'11'}" onclick="window._selectPose('${p.id}')">
        <div class="icon">${p.icon||'🖐️'}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.description}</div>
        <div style="margin-top:0.4rem;font-size:0.68rem;padding:0.18rem 0.45rem;border-radius:1rem;width:fit-content;font-weight:bold;
          ${ready ? 'background:rgba(39,174,96,0.18);color:#27ae60' : 'background:rgba(255,255,255,0.06);color:#555'}">
          ${ready ? '▶ 연습 가능' : '영상 준비 필요'}
        </div>
      </div>`;
    }).join('');
  }

  window._selectPose = async function(id) {
    currentPose = poseData.find(p => p.id === id);
    if (!currentPose || !currentPose.video || !currentPose.sequence) {
      alert('이 동작은 아직 영상이 준비되지 않았습니다.');
      return;
    }
    try {
      const res = await fetch('../' + currentPose.sequence);
      currentSeq = await res.json();
    } catch (e) { alert('시퀀스 파일 로드 실패'); return; }

    setupPracticeUI();
    setScreen('practice');
    await ensureCam();
  };

  function setupPracticeUI() {
    practiceActive = false;
    scoreHistory   = [];
    document.getElementById('pose-title-badge').textContent = currentPose.name;
    document.getElementById('countdown-pose-name').textContent = currentPose.name;
    document.getElementById('result-overlay').classList.add('hidden');
    document.getElementById('countdown-overlay').classList.add('hidden');
    document.getElementById('start-overlay').classList.remove('hidden');
    document.getElementById('score-number').textContent = '--';
    document.getElementById('score-bar').style.width = '0%';
    document.getElementById('feedback-text').textContent = '준비되면 시작 버튼을 누르세요';
    refVideo.src = '../' + currentPose.video;
    refVideo.load(); refVideo.pause(); refVideo.currentTime = 0;
  }

  window.startCountdown = async function() {
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('countdown-overlay').classList.remove('hidden');
    const el = document.getElementById('countdown-number');
    for (const n of [3,2,1]) { el.textContent = n; await sleep(900); }
    el.textContent = '시작!'; await sleep(600);
    document.getElementById('countdown-overlay').classList.add('hidden');
    beginRound();
  };

  function beginRound() {
    scoreHistory   = [];
    practiceActive = true;
    refVideo.currentTime = 0;
    refVideo.play().catch(() => {});
    document.getElementById('feedback-text').textContent = '동작을 따라해보세요!';
    refVideo.addEventListener('ended', onVideoEnded, { once: true });
  }

  function onVideoEnded() {
    practiceActive = false;
    refVideo.pause();
    const avg = avgScore();
    showPracticeResult(avg);
    DataManager.saveMotionScore(currentPose.id, avg);
    SheetsManager.saveMotionResult(SessionManager.get()?.name, currentPose.name, avg >= 70, scoreHistory.length);
    AiTutor.speak(avg >= 80 ? `훌륭해요! ${avg}점을 기록했습니다!` :
                  avg >= 60 ? `${avg}점입니다. 조금만 더 연습하면 완벽해질 거예요!` :
                              `${avg}점입니다. 참고 영상을 다시 보고 처음부터 따라해보세요.`);
  }

  async function ensureCam() {
    if (cameraStream) return;
    const attempts = [
      { video:{ facingMode:{ ideal:'user' }, width:{ ideal:640 }, height:{ ideal:480 } } },
      { video:{ facingMode:{ ideal:'user' } } },
      { video: true }
    ];
    let lastErr;
    for (const c of attempts) {
      try { cameraStream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch (e) { lastErr = e; cameraStream = null; }
    }
    if (!cameraStream) { alert('카메라 권한을 허용해주세요.'); return; }
    camVideo.srcObject = cameraStream;
    try { await camVideo.play(); } catch {}
    if (camVideo.readyState < 3) {
      await Promise.race([
        new Promise(r => camVideo.addEventListener('canplay', r, { once: true })),
        new Promise(r => setTimeout(r, 5000))
      ]);
    }
    startLoop();
  }

  function stopCam() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
    camVideo.srcObject = null;
  }

  function startLoop() {
    if (rafId) return;
    function frame() {
      rafId = requestAnimationFrame(frame);
      if (camVideo.readyState < 2 || camVideo.paused || !camVideo.videoWidth) return;
      const now = performance.now();
      if (now - lastInferenceMs < 100) return;
      if (now <= lastDetectTs) return;
      lastInferenceMs = now; lastDetectTs = now;

      offscreen.width  = camVideo.videoWidth;
      offscreen.height = camVideo.videoHeight;
      offscreenCtx.drawImage(camVideo, 0, 0);
      camCanvas.width  = camVideo.videoWidth;
      camCanvas.height = camVideo.videoHeight;
      ctx.clearRect(0, 0, camCanvas.width, camCanvas.height);

      let result;
      try { result = poseLandmarker.detectForVideo(offscreen, now); } catch { return; }
      const lms = result?.landmarks?.[0];

      ctx.save(); ctx.scale(-1,1); ctx.translate(-camCanvas.width, 0);
      if (lms && lms.length >= 33) {
        document.getElementById('no-pose-banner').classList.add('hidden');
        drawSkeleton(lms);
        if (practiceActive) processFrame(lms, now);
      } else {
        document.getElementById('no-pose-banner').classList.remove('hidden');
      }
      ctx.restore();
    }
    rafId = requestAnimationFrame(frame);
  }

  const POSE_CONN = [
    [0,1],[1,2],[2,3],[3,7],[0,4],[4,5],[5,6],[6,8],[9,10],
    [11,12],[11,13],[13,15],[15,17],[15,19],[15,21],[17,19],
    [12,14],[14,16],[16,18],[16,20],[16,22],[18,20],
    [11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],
    [27,29],[28,30],[27,31],[28,32],[29,31],[30,32]
  ];

  function drawSkeleton(lms) {
    const w = camCanvas.width, h = camCanvas.height;
    const color = currentPose?.color || '#00ffcc';
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (const [a, b] of POSE_CONN) {
      const p1 = lms[a], p2 = lms[b];
      if (!p1||!p2||(p1.visibility??1)<0.3||(p2.visibility??1)<0.3) continue;
      ctx.beginPath(); ctx.moveTo(p1.x*w, p1.y*h); ctx.lineTo(p2.x*w, p2.y*h); ctx.stroke();
    }
    ctx.fillStyle = color;
    for (const p of lms) {
      if ((p.visibility??1) < 0.3) continue;
      ctx.beginPath(); ctx.arc(p.x*w, p.y*h, 4, 0, Math.PI*2); ctx.fill();
    }
  }

  const JOINTS = [
    [24,12,14,2.5],[12,14,16,2.0],[23,11,13,2.5],[11,13,15,2.0],[12,11,23,1.0],[24,23,11,1.0]
  ];

  function getAngle(a,v,c) {
    const v1={x:a.x-v.x,y:a.y-v.y}, v2={x:c.x-v.x,y:c.y-v.y};
    const dot=v1.x*v2.x+v1.y*v2.y, mag=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
    if (mag===0) return 0;
    return Math.acos(Math.min(1,Math.max(-1,dot/mag)))*180/Math.PI;
  }

  function comparePoses(ref, live) {
    let total=0, w=0;
    for (const [p1,v,p2,wt] of JOINTS) {
      if ((live[p1]?.visibility??1)<0.4||(live[v]?.visibility??1)<0.4||(live[p2]?.visibility??1)<0.4) continue;
      const diff = Math.abs(getAngle(ref[p1],ref[v],ref[p2]) - getAngle(live[p1],live[v],live[p2]));
      total += Math.max(0, 1-diff/90) * wt; w += wt;
    }
    if (w===0) return 0;
    return Math.round((total/w)*100);
  }

  function processFrame(lms, now) {
    const f = currentSeq?.frames;
    if (!f?.length) return;
    const t = refVideo.currentTime;
    let best = -1;
    for (const frame of f) {
      if (Math.abs(frame.time - t) > 0.5) continue;
      const s = comparePoses(frame.landmarks, lms);
      if (s > best) best = s;
    }
    if (best < 0) {
      let lo=0,hi=f.length-1;
      while(lo<hi){const m=(lo+hi)>>1;if(f[m].time<t)lo=m+1;else hi=m;}
      if(lo>0&&Math.abs(f[lo-1].time-t)<Math.abs(f[lo].time-t))lo--;
      best = comparePoses(f[lo].landmarks, lms);
    }
    scoreHistory.push(best);
    updateScoreUI(best);

    // 음성 피드백 (3초마다, 점수 낮을 때)
    if (now - lastVoiceFeedback > 3000 && best < 60) {
      lastVoiceFeedback = now;
      const fbMsg = best >= 40 ? '거의 맞아요! 조금 더 정확하게 해보세요' : '참고 영상을 보며 동작을 천천히 따라해보세요';
      document.getElementById('feedback-text').textContent = fbMsg;
      const voiceInd = document.getElementById('voice-indicator');
      voiceInd.style.display = 'block';
      AiTutor.speak(fbMsg);
      setTimeout(() => { voiceInd.style.display = 'none'; }, 2000);
    }
  }

  function updateScoreUI(s) {
    const color = s>=80?'#27ae60':s>=60?'#f39c12':'#e74c3c';
    document.getElementById('score-number').textContent = s;
    document.getElementById('score-number').style.color = color;
    document.getElementById('score-bar').style.width = s+'%';
    document.getElementById('score-bar').style.background = color;
    if (s >= 80) document.getElementById('feedback-text').textContent = '완벽해요! 계속 유지하세요';
    else if (s >= 60) document.getElementById('feedback-text').textContent = '거의 맞아요! 조금 더 정확하게';
  }

  function avgScore() {
    return scoreHistory.length ? Math.round(scoreHistory.reduce((a,b)=>a+b,0)/scoreHistory.length) : 0;
  }

  function showPracticeResult(avg) {
    const max  = scoreHistory.length ? Math.max(...scoreHistory) : 0;
    const min  = scoreHistory.length ? Math.min(...scoreHistory) : 0;
    const pct  = scoreHistory.length ? Math.round(scoreHistory.filter(s=>s>=70).length/scoreHistory.length*100) : 0;
    const icon  = avg>=80?'🏆':avg>=60?'👍':'💪';
    const msg   = avg>=80?'훌륭한 동작이에요!':avg>=60?'잘 하셨어요!':'연습이 더 필요해요!';
    const color = avg>=80?'#27ae60':avg>=60?'#f39c12':'#e74c3c';
    document.getElementById('result-icon').textContent  = icon;
    document.getElementById('result-score').textContent = avg + '점';
    document.getElementById('result-score').style.color = color;
    document.getElementById('result-msg').textContent   = msg;
    document.getElementById('result-breakdown').innerHTML =
      `최고 ${max}점 &nbsp;·&nbsp; 최저 ${min}점<br>70점 이상 유지: ${pct}%`;
    document.getElementById('result-overlay').classList.remove('hidden');
  }

  window.retryPractice = function() {
    refVideo.removeEventListener('ended', onVideoEnded);
    setupPracticeUI();
  };

  window.stopPractice = function() {
    refVideo.removeEventListener('ended', onVideoEnded);
    practiceActive = false;
    stopCam();
    AiTutor.stopSpeaking();
    currentPose = null; currentSeq = null;
    buildSelect();
    setScreen('select');
  };

  function setScreen(name) {
    ['select','practice'].forEach(id => document.getElementById(id+'-screen').classList.add('hidden'));
    document.getElementById(name+'-screen').classList.remove('hidden');
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
